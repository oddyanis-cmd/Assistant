<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A financial analyst training simulator and personal analysis system — practice on realistic case files, or bring your own client data into Pro Analyzing Mode.">
<title>Keel — AI Financial Analysis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='12' fill='%230e0d0c'/%3E%3Cpath d='M13 31 C14 21 19 14 30 11 C27.5 18 24.5 25 22 31 Z' fill='%23e28a4d'/%3E%3Ccircle cx='30' cy='11' r='2' fill='%23f2ad76'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  /* ===== Keel design system — warm charcoal + amber, applied to the
     analyst workspace. Same variable names, Keel values, so the whole app
     re-skins at once. ===== */
  --ink:#0a1120;
  --ink-2:#0e1626;
  --panel:#131f33;
  --panel-2:#1a2942;
  --line:#26364e;
  /* Clean, document-like "paper" for statement panels + reports */
  --paper:#eef1f4;
  --paper-2:#dfe4ea;
  --paper-ink:#1b232d;
  --paper-ink-soft:#54606c;
  /* Money green / loss red — semantic, constant across the app */
  --green:#4fb87e;
  --green-deep:#2f8a5b;
  --green-rgb:79,184,126;
  --red:#dc8467;
  --red-deep:#b45638;
  --red-rgb:220,132,103;
  /* Keel amber accent (replaces the old brass/gold) */
  --brass:#4f8be6;
  --brass-soft:#3e72c9;
  --brass-rgb:79,139,230;
  --text:#eef2f8;
  --text-soft:#a4b3c6;
  --text-faint:#647087;
  --serif:'Newsreader', Georgia, serif;
  --sans:'Inter', -apple-system, sans-serif;
  --mono:'IBM Plex Mono', 'SF Mono', monospace;
  --radius:12px;
  --shadow: 0 12px 30px -12px rgba(0,0,0,0.6);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family: var(--sans);
  background: var(--ink);
  color: var(--text);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{ background: var(--brass); color:#0a1120; }
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit;}

/* ---------- Layout shell ---------- */
.app{
  display:grid;
  grid-template-columns: 250px 1fr;
  min-height:100vh;
}
.sidebar{
  background: linear-gradient(180deg, var(--ink-2), #070c16);
  border-right:1px solid var(--line);
  padding:22px 0 18px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  padding:0 20px 18px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}
.brand .mark{
  font-family:var(--serif);
  font-weight:700;
  font-size:20px;
  letter-spacing:0.2px;
  color:var(--paper);
}
.brand .mark span{ color:var(--brass); }
.brand .sub{
  font-size:11px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:1.4px;
  margin-top:4px;
}
.case-badge{
  margin:14px 16px 4px;
  padding:10px 12px;
  border:1px dashed var(--line);
  border-radius:8px;
  font-size:12px;
  color:var(--text-soft);
  display:none;
}
.case-badge.active{display:block;}
.case-badge .cb-name{ font-family:var(--serif); color:var(--paper); font-size:14px; display:block; margin-bottom:2px;}

nav.tabs{ display:flex; flex-direction:column; gap:2px; padding:6px 10px; flex:1; overflow-y:auto; }
.tab-group-label{
  font-size:10px; text-transform:uppercase; letter-spacing:1.4px; color:var(--text-faint);
  padding:14px 10px 6px;
}
.tab-btn{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:7px; border:none; background:transparent;
  color:var(--text-soft); font-size:13.5px; text-align:left; width:100%;
  transition: background .15s ease, color .15s ease;
}
.tab-btn:hover{ background: var(--panel); color:var(--text); }
.tab-btn.active{ background: var(--panel-2); color:var(--paper); }
.tab-btn.active .tab-ico{ color:var(--brass); }
.tab-btn:disabled{ opacity:0.35; cursor:not-allowed; }
.tab-ico{ width:16px; text-align:center; color:var(--text-faint); font-size:14px; }

.rc-tab-btn{ border:1px solid var(--green-deep); color:var(--paper); background:rgba(var(--green-rgb),0.08); }
.rc-tab-btn .tab-ico{ color:var(--green); }
.rc-tab-btn:hover{ background:rgba(var(--green-rgb),0.16); }
.rc-tab-btn.active{ background:var(--green-deep); color:#eef6f1; }
/* Mode split: Training vs Pro Analyzing Mode share one shell, one visible at a time */
.side-group{ margin-bottom:2px; }
body[data-keel-mode="training"] .pro-only{ display:none !important; }
body[data-keel-mode="pro"] .training-only{ display:none !important; }
#proAccount{ font-size:11.5px; color:var(--text-faint); line-height:1.65; margin-bottom:10px; }
#proAccount a{ color:var(--brass); text-decoration:underline; cursor:pointer; }
.rc-tab-btn.active .tab-ico{ color:#eef6f1; }

/* ---------- Mobile top bar & drawer nav (hidden on desktop) ---------- */
.mobile-topbar{ display:none; }
.hamburger-btn{
  width:34px; height:34px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:5px; background:transparent; border:1px solid var(--line); border-radius:7px; flex-shrink:0;
}
.hamburger-btn span{ display:block; width:16px; height:2px; background:var(--brass); border-radius:2px; }
.mobile-brand{ font-family:var(--serif); font-weight:700; font-size:16px; color:var(--paper); }
.mobile-brand span{ color:var(--brass); }
.sidebar-backdrop{ display:none; }
.sidebar-backdrop.open{ display:block; position:fixed; inset:0; background:rgba(8,11,15,0.62); z-index:230; }

.sidebar-foot{
  padding:14px 20px 0;
  border-top:1px solid var(--line);
  margin-top:10px;
  font-size:11px;
  color:var(--text-faint);
}

.lang-switch{ display:flex; gap:4px; padding:0 16px 14px; }
.lang-btn{ flex:1; padding:6px 0; font-size:11px; font-weight:600; border:1px solid var(--line); background:var(--panel); color:var(--text-faint); border-radius:6px; }
.lang-btn.active{ background:var(--panel-2); color:var(--brass); border-color:var(--brass-soft); }
.lang-btn:hover{ color:var(--text); }

.search-wrap{ position:relative; padding:0 16px 14px; }
.search-wrap .search-box{ margin-bottom:0; font-size:12.5px; padding:8px 12px; }
.search-results{
  position:absolute; left:16px; right:16px; top:calc(100% - 6px); z-index:50;
  background:var(--panel-2); border:1px solid var(--brass-soft); border-radius:8px;
  max-height:340px; overflow-y:auto; box-shadow:var(--shadow);
}
.search-result-item{ display:block; width:100%; text-align:left; padding:9px 12px; border:none; background:transparent; color:var(--text); font-size:12.5px; border-bottom:1px solid var(--line); }
.search-result-item:last-child{ border-bottom:none; }
.search-result-item:hover{ background:var(--panel); }
.search-result-item .sr-kind{ font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--brass); display:block; margin-bottom:2px; }
.search-empty{ padding:12px; font-size:12px; color:var(--text-faint); }

html[dir="rtl"] .rc-tab-btn, html[dir="rtl"] .tab-btn{ text-align:right; }
html[dir="rtl"] .case-header{ flex-direction:row-reverse; }
html[dir="rtl"] .stat-tile .label, html[dir="rtl"] .slider-row label{ text-align:right; }
html[dir="rtl"] .info-dot{ margin-right:0; margin-left:5px; }
html[dir="rtl"] table.ledger th:first-child, html[dir="rtl"] table.ledger td:first-child{ text-align:right; }
html[dir="rtl"] table.ledger th, html[dir="rtl"] table.ledger td{ text-align:left; }
html[dir="rtl"] .rc-row, html[dir="rtl"] .rc-opex-row{ direction:rtl; }
html[dir="rtl"] .dash-header{ flex-direction:row-reverse; }
html[dir="rtl"] .briefing-scene{ flex-direction:row-reverse; }
html[dir="rtl"] .search-results{ text-align:right; }
.xp-badge{
  margin:4px 16px 4px;
  padding:10px 12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
}
.xp-rank{ font-family:var(--serif); font-size:12.5px; color:var(--brass); font-weight:600; }
.xp-num{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); margin-top:5px; }
#xpBar{ height:100%; background:linear-gradient(90deg,var(--green-deep),var(--brass)); border-radius:5px; }

.main{
  padding: 28px 40px 60px;
  max-width:1180px;
}

/* ---------- Header / case strip ---------- */
.case-header{
  display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
  margin-bottom:26px; padding-bottom:20px; border-bottom:1px solid var(--line);
}
.case-header h1{
  font-family:var(--serif); font-weight:600; font-size:28px; color:var(--paper);
  margin-bottom:6px;
}
.case-header .meta{ font-size:13px; color:var(--text-soft); }
.case-header .meta b{ color:var(--text); }
.case-header .backstory{ font-size:13.5px; color:var(--text-soft); max-width:640px; margin-top:8px; }

.stamp{
  flex-shrink:0;
  width:86px; height:86px; border-radius:50%;
  border:3px solid currentColor;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--serif); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:1px;
  transform:rotate(-8deg);
  position:relative;
  opacity:0.92;
}
.stamp::before{
  content:''; position:absolute; inset:6px; border:1px solid currentColor; border-radius:50%; opacity:0.55;
}
.stamp.beginner{ color:var(--green); }
.stamp.intermediate{ color:var(--brass); }
.stamp.advanced{ color:var(--red); }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 16px; border-radius:7px; border:1px solid var(--line);
  background:var(--panel); color:var(--text); font-size:13px; font-weight:500;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.btn:hover{ border-color:var(--brass-soft); background:var(--panel-2); }
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:var(--green-deep); border-color:var(--green-deep); color:#eef6f1; }
.btn.primary:hover{ background:var(--green); border-color:var(--green); }
.btn.ghost{ background:transparent; }
.btn.small{ padding:6px 11px; font-size:12px; }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }

/* ---------- Cards & Paper ---------- */
.card{
  background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
  padding:20px; margin-bottom:20px;
}
.card h2{ font-family:var(--serif); font-size:18px; font-weight:600; color:var(--paper); margin-bottom:4px; }
.card .card-sub{ font-size:12.5px; color:var(--text-faint); margin-bottom:14px; }
.card svg{ max-width:100%; height:auto; }
.illo-sm svg{ max-width:280px; }

.paper{
  background: var(--paper);
  color: var(--paper-ink);
  border-radius:6px;
  padding:22px 24px;
  box-shadow: var(--shadow);
  position:relative;
  background-image:
    repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(43,36,24,0.045) 28px);
}
.paper::before{
  content:'';
  position:absolute; top:14px; left:14px; right:14px; bottom:14px;
  border:1px solid rgba(43,36,24,0.18);
  pointer-events:none;
  border-radius:2px;
}
.paper h3{
  font-family:var(--serif); font-size:16px; font-weight:700; margin-bottom:2px; color:var(--paper-ink);
}
.paper .paper-sub{ font-size:11.5px; color:var(--paper-ink-soft); margin-bottom:14px; text-transform:uppercase; letter-spacing:0.8px;}

table.ledger{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13px; }
table.ledger th{
  text-align:right; font-family:var(--sans); font-weight:600; font-size:11px; text-transform:uppercase;
  letter-spacing:0.6px; color:var(--paper-ink-soft); padding:6px 8px; border-bottom:1px solid rgba(43,36,24,0.3);
}
table.ledger th:first-child, table.ledger td:first-child{ text-align:left; font-family:var(--sans); font-size:12.5px;}
table.ledger td{ text-align:right; padding:6px 8px; border-bottom:1px solid rgba(43,36,24,0.12); }
table.ledger tr.subtotal td{ font-weight:700; border-top:1px solid rgba(43,36,24,0.4); border-bottom:2px double rgba(43,36,24,0.5); }
table.ledger tr.grand td{ font-weight:700; color:var(--green-deep); }
table.ledger tr.indent td:first-child{ padding-left:20px; color:var(--paper-ink-soft); }
.neg{ color: var(--red-deep); }
.pos{ color: var(--green-deep); }
.delta-tag{ font-family:var(--mono); font-size:11px; padding:1px 6px; border-radius:4px; }
.delta-tag.pos{ background:rgba(var(--green-rgb),0.15); }
.delta-tag.neg{ background:rgba(var(--red-rgb),0.15); }

/* ---------- Grid / stats ---------- */
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media (max-width:900px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr 1fr; } }

.stat-tile{
  background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:14px 16px;
}
.stat-tile .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-faint); margin-bottom:6px; display:flex; align-items:center; gap:5px;}
.stat-tile .value{ font-family:var(--mono); font-size:21px; font-weight:600; color:var(--paper); }
.stat-tile .hint{ font-size:11px; color:var(--text-faint); margin-top:5px; }
.info-dot{
  width:14px; height:14px; border-radius:50%; border:1px solid var(--text-faint); color:var(--text-faint);
  font-size:9.5px; display:inline-flex; align-items:center; justify-content:center; font-family:var(--serif); font-style:italic;
  cursor:help; flex-shrink:0;
}
.info-dot:hover{ border-color:var(--brass); color:var(--brass); }

/* ---------- Scenario picker ---------- */
.scenario-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; margin-top:18px; }
.scenario-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; cursor:pointer;
  transition: border-color .15s ease, transform .15s ease; position:relative; overflow:hidden;
}
.scenario-card:hover{ border-color:var(--brass-soft); transform:translateY(-2px); }
.scenario-card .sector-tag{
  font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--brass); margin-bottom:8px; display:block;
}
.scenario-card h3{ font-family:var(--serif); font-size:18px; color:var(--paper); margin-bottom:6px; }
.scenario-card p{ font-size:12.5px; color:var(--text-soft); margin-bottom:12px; }
.scenario-card .mini-stamp{
  position:absolute; top:14px; right:14px; width:44px; height:44px; border-radius:50%;
  border:2px solid currentColor; display:flex; align-items:center; justify-content:center;
  font-size:8.5px; font-weight:700; text-transform:uppercase; transform:rotate(-8deg); opacity:0.85;
}
.scenario-card .done-flag{
  font-size:11px; color:var(--green); display:flex; align-items:center; gap:5px;
}

/* ---------- Tabs (secondary, workspace) ---------- */
.subtabs{ display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:0;}
.subtab{
  padding:9px 14px; font-size:13px; color:var(--text-soft); border:none; background:transparent;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.subtab:hover{ color:var(--text); }
.subtab.active{ color:var(--paper); border-bottom-color:var(--brass); }

/* ---------- Forms ---------- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; color:var(--text-soft); margin-bottom:6px; font-weight:500; }
.field textarea, .field input[type=text]{
  width:100%; background:var(--ink-2); border:1px solid var(--line); border-radius:7px; color:var(--text);
  padding:10px 12px; font-size:13.5px; resize:vertical;
}
.field textarea{ min-height:90px; line-height:1.55; }
.field textarea:focus, .field input:focus{ outline:none; border-color:var(--brass-soft); }
.field .hint{ font-size:11.5px; color:var(--text-faint); margin-top:5px; }

.slider-row{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.slider-row label{ width:190px; flex-shrink:0; font-size:12.5px; color:var(--text-soft); }
.slider-row input[type=range]{ flex:1; accent-color:var(--brass); }
.slider-row .sval{ width:60px; text-align:right; font-family:var(--mono); font-size:13px; color:var(--paper); }

/* checklist */
.check-item{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; color:var(--text-soft); }
.check-item input{ margin-top:3px; accent-color:var(--green); }
.check-item.checked{ color:var(--text); }

/* progress bar */
.pbar{ height:8px; border-radius:5px; background:var(--ink-2); overflow:hidden; border:1px solid var(--line); }
.pbar > div{ height:100%; background:linear-gradient(90deg,var(--green-deep),var(--brass)); }

/* glossary */
.gloss-item{ padding:12px 0; border-bottom:1px solid var(--line); }
.gloss-item dt{ font-family:var(--serif); font-size:14.5px; color:var(--paper); margin-bottom:3px; }
.gloss-item dd{ font-size:13px; color:var(--text-soft); }
.gloss-formula{ font-family:var(--mono); font-size:12px; color:var(--brass); margin-top:4px; display:block; }

.search-box{
  width:100%; padding:10px 14px; background:var(--ink-2); border:1px solid var(--line); border-radius:8px;
  color:var(--text); font-size:13.5px; margin-bottom:16px;
}
.search-box:focus{ outline:none; border-color:var(--brass-soft); }

.chart-wrap{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:16px; height:260px; }

.empty-state{ text-align:center; padding:60px 20px; color:var(--text-faint); }
.empty-state .big-icon{ font-size:34px; margin-bottom:14px; }

.pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; border:1px solid var(--line); color:var(--text-soft); }
.pill.on{ border-color:var(--brass-soft); color:var(--brass); }

.lesson-box{
  border-left:3px solid var(--brass-soft); background:var(--panel-2); padding:12px 16px; border-radius:0 8px 8px 0;
  font-size:13px; color:var(--text-soft); margin:14px 0;
}
.lesson-box b{ color:var(--paper); }

.rc-row{ display:grid; grid-template-columns: 1fr 110px 110px; gap:10px; align-items:center; padding:6px 0; }
.rc-row-head{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.6px; padding-bottom:4px; }
.rc-row-label{ font-size:13px; color:var(--text-soft); }
.rc-row input[type=number], .rc-row input[type=text]{
  background:var(--ink-2); border:1px solid var(--line); border-radius:6px; color:var(--text);
  padding:6px 8px; font-size:13px; width:100%;
}
.rc-row input:focus{ outline:none; border-color:var(--brass-soft); }
.rc-opex-row{ grid-template-columns: 1.4fr 100px 100px 90px 70px; }
.rc-row-3{ grid-template-columns: 1fr 95px 95px 95px; }
.rc-opex-row-3{ grid-template-columns: 1.2fr 90px 90px 90px 85px 65px; }

/* ---- RC Data Entry: professional sectioned layout (pic-4 style) ---- */
.rc-entry{ max-width:940px; }
.rc-entry .rc-sec{ background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:var(--radius); padding:26px 26px 22px; margin-bottom:20px; box-shadow:0 24px 46px -32px rgba(0,0,0,.72); }
.rc-entry .rc-sec-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.rc-entry .rc-sec-eye{ font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--brass); white-space:nowrap; }
.rc-entry .rc-sec-head h2{ font-family:var(--serif); font-size:23px; color:var(--paper); margin:0; }
.rc-entry .rc-sub{ font-size:12.5px; color:var(--text-faint); margin:-4px 0 16px; max-width:72ch; line-height:1.6; }
.rc-entry .field label{ font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); font-weight:500; }

.rc-pre .pa-sec{ margin-bottom:20px; }

.pa-sec-title{ display:flex; align-items:center; gap:12px; margin:0 0 6px; }
.pa-sec-title .pa-eye{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--brass); white-space:nowrap; }

.pa-sec-title .pa-sec-verdict{ margin-inline-start:auto; }
.pa-ratio{ padding:11px 0; border-bottom:1px solid var(--line); }

.pa-r-top{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }

.pa-r-val{ font-family:var(--mono); font-size:14.5px; color:var(--paper); font-variant-numeric:tabular-nums; }
.pa-r-trend{ font-family:var(--mono); font-size:11.5px; }
.pa-up{ color:var(--green); } .pa-down{ color:var(--red); } .pa-flat{ color:var(--text-faint); }
.pa-verdict{ display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:20px; border:1px solid var(--line); }
.pa-v-good{ color:var(--green); border-color:rgba(79,184,126,.45); }
.pa-v-watch{ color:var(--brass); border-color:var(--brass-soft); }
.pa-v-attn{ color:var(--red); border-color:rgba(220,132,103,.55); }
.pa-tip{ font-size:12.5px; color:var(--text-faint); margin-top:6px; line-height:1.55; }
.pa-tip b{ color:var(--brass); font-weight:600; }
[dir="rtl"] .pa-sec-title .pa-eye, [dir="rtl"] .pa-verdict{ letter-spacing:normal; }
.rc-fixed-toggle{ font-size:11px; color:var(--text-faint); display:flex; align-items:center; gap:5px; }
.rc-fixed-toggle input{ accent-color:var(--green); }

.insight-card{ padding:12px 16px; border-radius:0 8px 8px 0; margin-bottom:10px; font-size:13.5px; border-left:3px solid; color:var(--text); }
.insight-red{ border-color:var(--red); background:rgba(var(--red-rgb),0.10); }
.insight-amber{ border-color:var(--brass); background:rgba(var(--brass-rgb),0.10); }
.insight-good{ border-color:var(--green); background:rgba(var(--green-rgb),0.10); }
.insight-tag{ font-size:10px; text-transform:uppercase; letter-spacing:0.8px; font-weight:700; margin-right:8px; }
.insight-red .insight-tag{ color:var(--red); }
.insight-amber .insight-tag{ color:var(--brass); }
.insight-good .insight-tag{ color:var(--green); }

.dash-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
.score-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media (max-width:900px){ .score-grid{ grid-template-columns:1fr 1fr; } }
.score-tile{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:14px 16px; position:relative; }
.score-dot{ width:10px; height:10px; border-radius:50%; margin-bottom:8px; }
.score-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-faint); margin-bottom:4px; }
.score-value{ font-family:var(--serif); font-size:15px; font-weight:600; }
.score-green{ border-color:rgba(var(--green-rgb),0.5); } .score-green .score-dot{ background:var(--green); } .score-green .score-value{ color:var(--green); }
.score-amber{ border-color:rgba(var(--brass-rgb),0.5); } .score-amber .score-dot{ background:var(--brass); } .score-amber .score-value{ color:var(--brass); }
.score-red{ border-color:rgba(var(--red-rgb),0.5); } .score-red .score-dot{ background:var(--red); } .score-red .score-value{ color:var(--red); }
.playbook-toggle{ margin-top:8px; font-size:12px; }
.playbook-steps{ margin-top:10px; padding-left:20px; font-size:13px; color:var(--text-soft); line-height:1.7; }

.briefing-scene{ display:flex; gap:20px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:20px; }
.briefing-avatar{ flex-shrink:0; width:84px; }
.briefing-avatar svg{ width:84px; height:84px; display:block; }
.briefing-eye{ animation: blinkEyes 4.5s infinite; transform-box: fill-box; transform-origin:center; }
@keyframes blinkEyes{ 0%,92%,100%{ transform:scaleY(1);} 95%{ transform:scaleY(0.12);} }
.briefing-mouth{ transform-box: fill-box; transform-origin:center; }
.briefing-avatar.talking{ animation: bobHead 1.6s ease-in-out infinite; }
.briefing-avatar.talking .briefing-mouth{ animation: talkMouth 0.32s steps(2) infinite; }
@keyframes talkMouth{ 0%,100%{ transform:scaleY(1);} 50%{ transform:scaleY(0.35);} }
@keyframes bobHead{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-3px);} }
.briefing-bubble{ flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px 18px; }
.briefing-name{ font-family:var(--serif); font-size:11.5px; color:var(--brass); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; }
.briefing-text{ font-size:14px; color:var(--text); line-height:1.6; min-height:44px; }

@keyframes cursorBlink{ 50%{ opacity:0; } }
.briefing-actions{ margin-top:10px; display:flex; gap:8px; }

.toast{

  transform:translateY(20px); opacity:0; transition:all .25s ease; pointer-events:none; z-index:310;
}
.toast.show{ transform:translateY(0); opacity:1; }

.modal-overlay{
  position:fixed; inset:0; background:rgba(8,11,15,0.72); z-index:300;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-card{
  background:var(--panel-2); border:1px solid var(--brass-soft); border-radius:12px;
  padding:24px; max-width:420px; width:100%; box-shadow:var(--shadow);

.modal-card h3{ font-family:var(--serif); font-size:17px; color:var(--paper); margin-bottom:12px; }
.modal-card p{ font-size:13.5px; color:var(--text-soft); line-height:1.6; margin-bottom:6px; }
.modal-card .field{ margin-bottom:0; }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }

/* ---------- Phone-specific tightening ---------- */
@media (max-width:640px){
  /* Prevent iOS Safari from auto-zooming on focus (needs >=16px inputs) */
  input, textarea, select{ font-size:16px !important; }
  .rc-row input, .rc-opex-row input{ font-size:14px !important; }

  .btn{ padding:11px 15px; }
  [style*="display:flex"]{ flex-wrap: wrap; row-gap: 10px; }

  .grid-2, .grid-3, .grid-4{ grid-template-columns: 1fr; }

  .case-header{ flex-direction:column !important; align-items:flex-start !important; gap:14px; }

  .card{ overflow-x:auto; }
  .rc-row, .rc-opex-row{ min-width:440px; }

  .search-wrap{ padding:0 12px 12px; }
  .modal-card{ padding:20px 18px; }

  .slider-row{ flex-wrap:wrap; }

  .slider-row input[type=range]{ flex:1 1 auto; min-width:140px; }

  .diag-option{ font-size:13px; }
  .rc-fixed-toggle{ white-space:nowrap; }

  h1{ font-size:22px !important; }

}
@media (max-width:420px){
  .main{ padding:16px 12px 50px; }

const GLOSSARY = [
  {term:'Current Ratio', formula:'Current Assets ÷ Current Liabilities', def:'Measures whether short-term assets can cover short-term obligations. Above 1.0 is generally considered adequate, but the quality of current assets matters as much as the ratio itself.'},
  {term:'Quick Ratio (Acid-Test)', formula:'(Current Assets − Inventory) ÷ Current Liabilities', def:'A stricter liquidity test that excludes inventory, since inventory can be slow to convert to cash. Useful when current ratio looks fine but you suspect inventory is propping it up.'},
  {term:'Gross Margin', formula:'(Revenue − COGS) ÷ Revenue', def:'The percentage of revenue left after direct costs of producing goods or services, before operating expenses.'},
  {term:'Net Margin', formula:'Net Income ÷ Revenue', def:'The percentage of revenue that ultimately becomes profit after every expense, interest, and tax.'},
  {term:'Return on Assets (ROA)', formula:'Net Income ÷ Total Assets', def:'How efficiently a company turns its total asset base into profit, regardless of how those assets were financed.'},
  {term:'Return on Equity (ROE)', formula:'Net Income ÷ Total Equity', def:'The return generated on shareholders\u2019 capital specifically. Can be inflated by leverage, which is why DuPont analysis breaks it apart.'},
  {term:'DuPont Analysis', formula:'ROE = Net Margin × Asset Turnover × Equity Multiplier', def:'Splits ROE into profitability, efficiency, and leverage components, so you can see whether a strong ROE is coming from real operating performance or just from debt.'},
  {term:'Debt-to-Equity Ratio', formula:'Total Liabilities ÷ Total Equity', def:'Shows how much the company relies on debt versus owner capital. Rising debt-to-equity alongside falling interest coverage is a classic early warning sign.'},
  {term:'Interest Coverage Ratio', formula:'Operating Income ÷ Interest Expense', def:'How many times over a company can pay its interest bill from operating profit. A falling ratio, even with growing profit, signals rising financial risk.'},
  {term:'Inventory Turnover', formula:'COGS ÷ Inventory', def:'How many times inventory is sold and replaced in a period. Low turnover can hide behind a healthy-looking current ratio.'},
  {term:'Days Sales Outstanding (DSO)', formula:'(Accounts Receivable ÷ Revenue) × 365', def:'The average number of days it takes to collect payment after a sale. Rising DSO is one of the most common hidden causes of a cash squeeze.'},
  {term:'Asset Turnover', formula:'Revenue ÷ Total Assets', def:'How efficiently a company generates revenue from its asset base — a key input to both ROA and the DuPont breakdown.'},
  {term:'Break-Even Point', formula:'Fixed Costs ÷ (1 − Variable Cost Ratio)', def:'The revenue level at which a business covers all its costs with zero profit. Essential in fixed-cost-heavy industries like restaurants and manufacturing.'},
  {term:'Operating Leverage', def:'Describes how sensitive operating profit is to changes in revenue. High fixed costs relative to variable costs means small revenue swings cause large profit swings — in either direction.'},
  {term:'Working Capital', formula:'Current Assets − Current Liabilities', def:'The cash tied up in day-to-day operations. Growing revenue often requires more working capital, which is easy to overlook when focused only on the income statement.'},
  {term:'Free Cash Flow', formula:'Cash from Operations − Capital Expenditures', def:'Cash left over after funding operations and reinvestment — often a better indicator of financial flexibility than net income alone.'},
  {term:'Deferred Revenue', def:'Cash collected for a service not yet delivered (common in subscription businesses). It\u2019s a liability, not revenue yet — a frequent point of confusion for new analysts.'},
  {term:'Budget Variance Analysis', def:'Comparing actual results to budgeted targets to explain what drove the difference — a favorable or unfavorable revenue variance, cost variance, or both.'},
  {term:'Contribution Margin', formula:'Revenue − Variable Costs', def:'What\u2019s left from each dollar of revenue after variable costs, available to cover fixed costs and then profit.'},
  {term:'Days Inventory Outstanding (DIO)', formula:'(Inventory ÷ COGS) × 365', def:'The average number of days inventory sits before being sold. Feeds into the cash conversion cycle alongside DSO and DPO.'},
  {term:'Days Payable Outstanding (DPO)', formula:'(Accounts Payable ÷ COGS) × 365', def:'The average number of days a company takes to pay its own suppliers. A rising DPO can be a deliberate cash management choice — or a sign of strain.'},
  {term:'Cash Conversion Cycle (CCC)', formula:'DSO + DIO − DPO', def:'The number of days between paying for inputs and collecting cash from customers. Shorter is generally better. Watch for businesses (like project contractors) where this standard formula misses important cash-tied-up items.'},
  {term:'Unbilled Receivables (Contract Assets)', def:'Revenue recognized for work already performed but not yet invoiced to the client — common in construction and other long-contract businesses. It\u2019s real revenue, but not yet a formal receivable or cash.'},
  {term:'Retention Receivable', def:'A portion of billed amounts that a client withholds until a project is fully complete, as security. It\u2019s an asset to the contractor, but one of the slowest to collect.'},
  {term:'Income Statement', def:'A summary of revenue, costs, and profit over a period of time (a quarter or a year). It answers "did the business make money" — as distinct from the balance sheet, which is a snapshot at one point in time.'},
  {term:'Balance Sheet', formula:'Assets = Liabilities + Equity', def:'A snapshot of what a business owns (assets), owes (liabilities), and what\u2019s left for owners (equity) at one specific date. It always balances by definition — that\u2019s not a coincidence, it\u2019s the accounting identity.'},
  {term:'Statement of Cash Flows', def:'A breakdown of actual cash moving in and out of the business, split into operating, investing, and financing activities. It exists because profit (on the income statement) and cash are not the same thing.'},
  {term:'Accounts Receivable', def:'Money owed to the business by customers who\u2019ve already been billed but haven\u2019t paid yet. It\u2019s an asset, but not cash — the gap between the two is where a lot of real-world cash problems hide.'},
  {term:'Accounts Payable', def:'Money the business owes to its own suppliers for goods or services already received but not yet paid for. Stretching payables can be a deliberate cash management tool, or a sign of strain.'},
  {term:'Retained Earnings', formula:'Prior Retained Earnings + Net Income − Dividends', def:'The accumulated profit a company has kept (rather than paid out to owners) since it started. It\u2019s part of equity, alongside contributed capital.'},
  {term:'Fixed Costs', def:'Costs that stay roughly the same regardless of how much the business sells — rent and salaried labor are common examples. They\u2019re the key input to break-even analysis.'},
  {term:'Variable Costs', def:'Costs that rise and fall directly with volume — materials, hourly labor tied to production, and payment-processing fees are common examples.'},
  {term:'EBITDA', formula:'Earnings Before Interest, Tax, Depreciation & Amortization', def:'A profit measure that strips out financing decisions and non-cash accounting charges, often used to compare operating performance across companies with different capital structures. It is not the same as cash flow, despite sometimes being used as a rough proxy for it.'},
  {term:'Amortization', def:'The gradual write-down of an intangible asset\u2019s cost over its useful life — the intangible-asset counterpart to depreciation, which applies to physical assets.'},
  {term:'Capitalized Software', def:'Software development costs recorded as an asset on the balance sheet (and expensed gradually over time) rather than expensed immediately, because the software is expected to provide value over multiple periods.'},
  {term:'Runway', def:'How long a company can keep operating at its current cash balance and burn rate before running out of cash — usually expressed in months. A core metric for any business that isn\u2019t yet cash-flow positive.'},
  {term:'Burn Rate', def:'How much cash a company is spending (net of any revenue) per month or per period. Compared against cash on hand, it produces runway.'},
  {term:'CAGR (Compound Annual Growth Rate)', formula:'(Ending Value ÷ Starting Value)^(1 ÷ Years) − 1', def:'The smoothed annual growth rate that would take a starting figure to an ending figure over a number of years, if it grew at a steady compounding rate. Useful for comparing growth across businesses or time periods of different lengths.'},
  {term:'Forecast / Projection', def:'An estimate of future financial results based on stated assumptions (growth rate, cost structure, planned investment). A forecast is only as good as its assumptions — always state them alongside the numbers.'},
  {term:'Customer Concentration Risk', def:'The risk that a large share of revenue or receivables comes from one or a small number of customers — if one leaves, pays late, or renegotiates terms, the impact is outsized.'},
  {term:'Percentage of Completion', def:'A revenue recognition method for long-term contracts (common in construction) where revenue is recorded in proportion to work completed, rather than waiting until the whole project is finished or invoiced.'},
  {term:'Loan Covenant', def:'A condition attached to a loan that the borrower must maintain — for example, keeping interest coverage above a set level. Breaching a covenant can trigger penalties or even let the lender demand early repayment.'},

  {term:'Common-Size Statement', def:'A financial statement restated so every line is shown as a percentage (of revenue for the income statement, of total assets for the balance sheet) instead of raw currency — this strips out scale so periods, or companies of different sizes, can be compared directly.'},

  {term:'Accrual Accounting', def:'Recording revenue when it\u2019s earned and expenses when they\u2019re incurred, regardless of when cash actually changes hands. Nearly all businesses beyond the smallest use this method — it\u2019s why profit and cash flow can diverge.'}

/* =========================================================
   CALCULATION ENGINE
   Every number in the ratio/CF/breakeven views is derived
   generically from the raw scenario data above — nothing
   here is hardcoded per scenario.
   ========================================================= */

function totals(bs){
  const totalCA = bs.cash + bs.ar + bs.inventory + bs.otherCA + (bs.unbilledAR||0) + (bs.retentionReceivable||0);
  const totalAssets = totalCA + bs.ppe + bs.otherLTA;
  const totalCL = bs.ap + (bs.stDebt||0) + bs.otherCL + (bs.deferredRevenue||0);
  const totalLiab = totalCL + bs.ltDebt;
  const equity = totalAssets - totalLiab;
  return {totalCA, totalAssets, totalCL, totalLiab, equity};
}

function incomeTotals(inc){
  const opexTotal = Object.values(inc.opex).reduce((a,b)=>a+b,0);
  const grossProfit = inc.revenue - inc.cogs;
  const operatingIncome = grossProfit - opexTotal;
  const pretax = operatingIncome - inc.interest;
  const tax = Math.max(0,pretax) * inc.taxRate;
  const netIncome = pretax - tax;
  return {opexTotal, grossProfit, operatingIncome, pretax, tax, netIncome};
}

function computeCF(sc){
  const y1 = sc.balance.y1, y2 = sc.balance.y2;
  const inc2 = incomeTotals(sc.income.y2);
  const dep = sc.income.y2.opex.dep || 0;
  const t1 = totals(y1), t2 = totals(y2);
  const dAR = y2.ar - y1.ar;
  const dInv = y2.inventory - y1.inventory;
  const dOtherCA = y2.otherCA - y1.otherCA;
  const dUnbilled = (y2.unbilledAR||0) - (y1.unbilledAR||0);
  const dRetention = (y2.retentionReceivable||0) - (y1.retentionReceivable||0);
  const dAP = y2.ap - y1.ap;
  const dOtherCL = y2.otherCL - y1.otherCL;
  const dDeferred = (y2.deferredRevenue||0) - (y1.deferredRevenue||0);
  const cfo = inc2.netIncome + dep - dAR - dInv - dOtherCA - dUnbilled - dRetention + dAP + dOtherCL + dDeferred;
  const capex = (y2.ppe - y1.ppe) + dep;
  const dOtherLTA = y2.otherLTA - y1.otherLTA;
  const cfi = -capex - dOtherLTA;
  const dStDebt = (y2.stDebt||0) - (y1.stDebt||0);
  const dLtDebt = y2.ltDebt - y1.ltDebt;
  const dCommonStock = y2.commonStock - y1.commonStock;
  const re1 = t1.equity - y1.commonStock, re2 = t2.equity - y2.commonStock;
  const dividends = re1 + inc2.netIncome - re2;
  const cff = dStDebt + dLtDebt + dCommonStock - dividends;
  const netChange = cfo + cfi + cff;
  return {netIncome:inc2.netIncome, dep, dAR, dInv, dOtherCA, dUnbilled, dRetention, dAP, dOtherCL, dDeferred,
          cfo, capex, dOtherLTA, cfi, dStDebt, dLtDebt, dCommonStock, dividends, cff,
          netChange, beginCash:y1.cash, endCash:y2.cash};
}

function breakeven(sc){
  const inc = sc.income.y2;
  let fixed = 0, variable = inc.cogs;
  for(const k in inc.opex){
    if(sc.costStructure.fixedKeys.includes(k)) fixed += inc.opex[k];
    else variable += inc.opex[k];
  }
  if(sc.costStructure.includeInterestAsFixed) fixed += inc.interest;
  const varRatio = inc.revenue > 0 ? (variable / inc.revenue) : 0;
  const breakevenRevenue = varRatio < 1 ? (fixed / (1 - varRatio)) : Infinity;
  return {fixed, variable, varRatio, breakevenRevenue};
}

function computeRatios(sc){
  const t1 = totals(sc.balance.y1), t2 = totals(sc.balance.y2);
  const i1 = incomeTotals(sc.income.y1), i2 = incomeTotals(sc.income.y2);
  function set(bs, tot, inc, inct){
    const dso = (bs.ar / inc.revenue) * 365;
    const dio = inc.cogs > 0 ? (bs.inventory / inc.cogs) * 365 : 0;
    const dpo = inc.cogs > 0 ? (bs.ap / inc.cogs) * 365 : 0;
    return {
      current: tot.totalCA / tot.totalCL,
      quick: (tot.totalCA - bs.inventory - (bs.unbilledAR||0) - (bs.retentionReceivable||0)) / tot.totalCL,
      grossMargin: inct.grossProfit / inc.revenue,
      netMargin: inct.netIncome / inc.revenue,
      operatingMargin: inct.operatingIncome / inc.revenue,
      roa: inct.netIncome / tot.totalAssets,
      roe: inct.netIncome / tot.equity,
      debtEquity: tot.totalLiab / tot.equity,
      interestCoverage: inc.interest > 0 ? inct.operatingIncome / inc.interest : null,
      inventoryTurnover: bs.inventory > 0 ? inc.cogs / bs.inventory : null,
      dso, dio, dpo,
      ccc: dso + dio - dpo,
      assetTurnover: inc.revenue / tot.totalAssets,
      equityMultiplier: tot.totalAssets / tot.equity
    };
  }
  return { y1:set(sc.balance.y1,t1,sc.income.y1,i1), y2:set(sc.balance.y2,t2,sc.income.y2,i2) };
}

function proForma(sc, growthPct, costRatioDeltaPct, opexChangePct){
  const base = sc.income.y2;
  const revenue = base.revenue * (1 + growthPct/100);
  const baseCogsRatio = base.revenue > 0 ? (base.cogs / base.revenue) : 0;
  const newCogsRatio = Math.max(0.05, baseCogsRatio + costRatioDeltaPct/100);
  const cogs = revenue * newCogsRatio;
  const opex = {};
  for(const k in base.opex){ opex[k] = base.opex[k] * (1 + (opexChangePct||0)/100); }
  const grossProfit = revenue - cogs;
  const opexTotal = Object.values(opex).reduce((a,b)=>a+b,0);
  const operatingIncome = grossProfit - opexTotal;
  const pretax = operatingIncome - base.interest;
  const tax = Math.max(0,pretax) * base.taxRate;
  const netIncome = pretax - tax;
  return {revenue, cogs, grossProfit, opexTotal, operatingIncome, pretax, tax, netIncome};
}

/* =========================================================
   FORMATTING HELPERS
   ========================================================= */
function fmt(n){
  if(n===null || n===undefined || !isFinite(n)) return '—';
  const r = Math.round(n);
  if(r === 0) return '0';
  if(r < 0) return '(' + Math.abs(r).toLocaleString('en-US') + ')';
  return r.toLocaleString('en-US');
}
function fmtSigned(n){
  const r = Math.round(n);
  if(r === 0) return '0';
  return (r>0?'+':'−') + Math.abs(r).toLocaleString('en-US');
}
function pct(n, d){
  if(n===null || n===undefined || !isFinite(n)) return '—';
  return (n*100).toFixed(d===undefined?1:d) + '%';
}
function ratio(n){ return n===null || !isFinite(n) ? '—' : n.toFixed(2) + 'x'; }
function days(n){
  if(n===null || n===undefined || !isFinite(n)) return '—';
  return Math.round(n) + ' days';
}
function pctDelta(a,b){ // b vs a, a is base
  if(a===0) return null;
  return (b-a)/Math.abs(a);
}
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

function normalizeRCClient(client){
  if(!client) return client;
  if(!client.costStructure) client.costStructure = {fixedKeys:[], includeInterestAsFixed:true};
  if(!client.costStructure.fixedKeys) client.costStructure.fixedKeys = [];
  if(!client.forecast) client.forecast = {growth:10, cogsDelta:0, opexChange:0, budgetPush:0, pushLabel:'', label:'Next Period'};
  if(client.hasY0 === undefined) client.hasY0 = false;
  if(!client.y0Label) client.y0Label = '2 Years Ago';
  if(!client.income) client.income = {};
  if(!client.balance) client.balance = {};
  if(!client.income.y0) client.income.y0 = {revenue:0, cogs:0, opex:{}, interest:0, taxRate:0.20};
  if(!client.balance.y0) client.balance.y0 = {cash:0, ar:0, inventory:0, otherCA:0, ppe:0, otherLTA:0, ap:0, stDebt:0, otherCL:0, ltDebt:0, commonStock:0};
  if(!client.income.y1) client.income.y1 = {revenue:0, cogs:0, opex:{}, interest:0, taxRate:0.20};
  if(!client.income.y2) client.income.y2 = {revenue:0, cogs:0, opex:{}, interest:0, taxRate:0.20};
  if(!client.balance.y1) client.balance.y1 = {cash:0, ar:0, inventory:0, otherCA:0, ppe:0, otherLTA:0, ap:0, stDebt:0, otherCL:0, ltDebt:0, commonStock:0};
  if(!client.balance.y2) client.balance.y2 = {cash:0, ar:0, inventory:0, otherCA:0, ppe:0, otherLTA:0, ap:0, stDebt:0, otherCL:0, ltDebt:0, commonStock:0};
  if(!client.report) client.report = {execSummary:'', keyFindings:'', risks:'', recommendations:''};
  // Migrate legacy budget shape: opex used to be a single total number.
  if(client.budget){
    if(typeof client.budget.opex === 'number'){
      const legacyTotal = client.budget.opex;
      client.budget.opex = legacyTotal > 0 ? {'Budgeted Operating Expenses': legacyTotal} : {};
    }
    if(!client.budget.opex || typeof client.budget.opex !== 'object') client.budget.opex = {};
    if(client.budget.interest === undefined) client.budget.interest = 0;
    if(client.budget.notes === undefined) client.budget.notes = '';
    if(client.budget.revenue === undefined) client.budget.revenue = 0;
    if(client.budget.cogs === undefined) client.budget.cogs = 0;
  }
  return client;
}

/* =========================================================
   GAMIFICATION: XP, RANKS, ACHIEVEMENTS
   XP is always computed live from Store data — never stored
   as a running counter — so it can never drift or double-count.
   ========================================================= */
const WORKSPACE_TABS = ['financials','ratios','diagnosis','toolkit','assumptions','report','advisory'];

const RANKS = [
  {min:0,    name:'Trainee Analyst'},
  {min:200,  name:'Junior Analyst'},
  {min:500,  name:'Analyst'},
  {min:1000, name:'Senior Analyst'},
  {min:1600, name:'Principal Analyst'},
  {min:2200, name:'Partner-Track Analyst'}
];

function rankForXP(xp){
  let current = RANKS[0], next = null;
  for(let i=0;i<RANKS.length;i++){
    if(xp >= RANKS[i].min) current = RANKS[i];
    else { next = RANKS[i]; break; }
  }
  return {name:current.name, next, floor:current.min};
}

function computeXP(){
  let xp = 0;
  SCENARIOS.forEach(sc=>{
    const rec = Store.data.scenarios[sc.id];
    if(!rec) return;
    WORKSPACE_TABS.forEach(t=>{ if(rec.visited && rec.visited[t]) xp += 10; });
    if(rec.report){
      ['execSummary','keyFindings','risks','recommendations'].forEach(k=>{
        if(rec.report[k] && rec.report[k].trim().length > 0) xp += 10;
      });
    }
    Object.values(rec.advisory||{}).forEach(a=>{
      xp += (a.checks||[]).filter(Boolean).length * 5;
    });
    if(rec.diagnosis && rec.diagnosis.submitted && rec.diagnosis.correct) xp += 25;
    if(rec.completed) xp += 50;
  });
  return xp;
}

function scenariosCompletedCount(){
  return SCENARIOS.filter(sc => Store.data.scenarios[sc.id] && Store.data.scenarios[sc.id].completed).length;
}
function sectorsCompletedCount(){
  return new Set(SCENARIOS.filter(sc => Store.data.scenarios[sc.id] && Store.data.scenarios[sc.id].completed).map(sc=>sc.sector)).size;
}
function diagnosisCorrectStreak(){
  // longest run, in scenario array order, of first-try-correct diagnoses
  let best=0, cur=0;
  SCENARIOS.forEach(sc=>{
    const rec = Store.data.scenarios[sc.id];
    if(rec && rec.diagnosis && rec.diagnosis.submitted && rec.diagnosis.correct){ cur++; best=Math.max(best,cur); }
    else if(rec && rec.diagnosis && rec.diagnosis.submitted){ cur=0; }
  });
  return best;
}

const ACHIEVEMENTS = [
  {id:'first_case', label:'First Case Closed', desc:'Complete your first case file.', test:()=>scenariosCompletedCount()>=1},
  {id:'three_sectors', label:'Cross-Sector Analyst', desc:'Complete cases in three different sectors.', test:()=>sectorsCompletedCount()>=3},
  {id:'five_cases', label:'Case Load', desc:'Complete five case files.', test:()=>scenariosCompletedCount()>=5},
  {id:'all_cases', label:'Full Portfolio', desc:'Complete every case file in the library.', test:()=>scenariosCompletedCount()>=SCENARIOS.length},
  {id:'sharp_eye', label:'Sharp Eye', desc:'Diagnose three cases correctly in a row, first try.', test:()=>diagnosisCorrectStreak()>=3},
  {id:'senior_rank', label:'Senior Analyst', desc:'Reach Senior Analyst rank or higher.', test:()=>computeXP()>=1000}
];

function updateXPBadge(){
  const xp = computeXP();
  const r = rankForXP(xp);
  const rankEl = document.getElementById('xpRank');
  const barEl = document.getElementById('xpBar');
  const numEl = document.getElementById('xpNum');
  if(!rankEl) return;
  rankEl.textContent = r.name;
  const span = r.next ? (r.next.min - r.floor) : 1;
  const into = xp - r.floor;
  barEl.style.width = Math.min(100, (into/span*100)).toFixed(0) + '%';
  numEl.textContent = xp + ' XP' + (r.next ? (' · ' + (r.next.min-xp) + ' to ' + r.next.name) : ' · Max rank');
}

function seededShuffle(arr, seedStr){
  let seed = 0;
  for(let i=0;i<seedStr.length;i++) seed = (seed*31 + seedStr.charCodeAt(i)) >>> 0;
  function rand(){ seed = (seed*1103515245 + 12345) >>> 0; return seed / 4294967296; }
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    const tmp = a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function buildSearchIndex(){
  const idx = [];
  SCENARIOS.forEach(sc=>{
    idx.push({kind:t('search.cases'), label:sc.name, sub:sc.sector, action:()=>{ selectScenario(sc.id); closeSearch(); }});
  });
  GLOSSARY.forEach(g=>{
    idx.push({kind:t('search.glossary'), label:g.term, sub:g.def.slice(0,70)+'…', action:()=>{
      State.view='trainer'; setActiveTab('trainer'); trainerTab='glossary'; renderMain();
      setTimeout(()=>{ const box=document.getElementById('glossSearch'); if(box){ box.value=g.term; renderGlossList(g.term); } }, 0);
      closeSearch();
    }});
  });
  (Store.data.rc.order||[]).forEach(id=>{
    const c = Store.data.rc.clients[id];
    if(!c) return;
    idx.push({kind:t('search.client'), label:c.name, sub:c.sector||'', action:()=>{
      if(!keelRequirePro()) return;
      Store.data.rc.activeId = id; Store.save();
      State.view='rc'; setActiveTab('rc'); rcTab='entry'; renderMain();
      closeSearch();
    }});
  });
  return idx;
}
function closeSearch(){
  const results = document.getElementById('searchResults');
  const box = document.getElementById('globalSearch');
  if(results) results.style.display = 'none';
  if(box) box.value = '';
}
function runSearch(query){
  const results = document.getElementById('searchResults');
  if(!results) return;
  const q = query.trim().toLowerCase();
  if(!q){ results.style.display='none'; return; }
  const matches = buildSearchIndex().filter(item=>
    item.label.toLowerCase().includes(q) || (item.sub||'').toLowerCase().includes(q)
  ).slice(0, 12);
  if(matches.length===0){
    results.innerHTML = `<div class="search-empty">${esc(t('search.none'))}</div>`;
  } else {
    results.innerHTML = matches.map((m,i)=>`
      <button class="search-result-item" data-sridx="${i}">
        <span class="sr-kind">${esc(m.kind)}</span>${esc(m.label)}${m.sub?(' — <span style="color:var(--text-faint);">'+esc(m.sub)+'</span>'):''}
      </button>`).join('');
    results.querySelectorAll('[data-sridx]').forEach(btn=>{
      btn.addEventListener('click', ()=> matches[+btn.dataset.sridx].action());
    });
  }
  results.style.display = 'block';
}
(function initSearch(){
  const box = document.getElementById('globalSearch');
  if(!box) return;
  box.addEventListener('input', ()=> runSearch(box.value));
  box.addEventListener('focus', ()=>{ if(box.value.trim()) runSearch(box.value); });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')) closeSearch();
  });
})();

/* ---------- IN-APP MODAL (replaces native prompt/confirm/alert, which are
   silently blocked in many sandboxed/embedded viewing contexts) ---------- */
function openModal(html, onOpen){
  const overlay = document.getElementById('modalOverlay');
  const card = document.getElementById('modalCard');
  card.innerHTML = html;
  overlay.style.display = 'flex';
  if(onOpen) onOpen(card);
  const escHandler = (e)=>{ if(e.key === 'Escape') closeModal(); };
  overlay._escHandler = escHandler;
  document.addEventListener('keydown', escHandler);
}
function closeModal(){
  const overlay = document.getElementById('modalOverlay');
  overlay.style.display = 'none';
  document.getElementById('modalCard').innerHTML = '';
  if(overlay._escHandler) document.removeEventListener('keydown', overlay._escHandler);
}
(function wireModalOverlayClick(){
  const overlay = document.getElementById('modalOverlay');
  if(overlay) overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
})();

function promptText(title, label, defaultValue, onConfirm){
  openModal(`
    <h3>${esc(title)}</h3>
    <div class="field"><label>${esc(label)}</label><input type="text" id="modalTextInput" value="${esc(defaultValue||'')}"></div>
    <div class="modal-actions">
      <button class="btn" id="modalCancelBtn">Cancel</button>
      <button class="btn primary" id="modalOkBtn">Create</button>
    </div>
  `, (card)=>{
    const input = card.querySelector('#modalTextInput');
    input.focus();
    input.select();
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); card.querySelector('#modalOkBtn').click(); } });
  });
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalOkBtn').addEventListener('click', ()=>{
    const val = document.getElementById('modalTextInput').value;
    closeModal();
    onConfirm(val);
  });
}

function confirmAction(title, message, onConfirm, opts){
  opts = opts || {};
  openModal(`
    <h3>${esc(title)}</h3>
    <p>${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn" id="modalCancelBtn">Cancel</button>
      <button class="btn" id="modalOkBtn" style="${opts.danger ? 'background:var(--red-deep);border-color:var(--red-deep);color:#fbeae7;' : ''}">${esc(opts.confirmLabel||'Confirm')}</button>
    </div>
  `);
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalOkBtn').addEventListener('click', ()=>{
    closeModal();
    onConfirm();
  });
}

function incomeRows(sc){
  const i1 = incomeTotals(sc.income.y1), i2 = incomeTotals(sc.income.y2);
  const y1 = sc.income.y1, y2 = sc.income.y2;
  let rows = '';
  rows += rowLine('Revenue', y1.revenue, y2.revenue);
  rows += rowLine('Cost of Goods / Services', -y1.cogs, -y2.cogs, true);
  rows += rowSub('Gross Profit', i1.grossProfit, i2.grossProfit);
  for(const k in y2.opex){
    rows += rowLine(OPEX_LABELS[k]||k, -y1.opex[k], -y2.opex[k], true);
  }
  rows += rowSub('Operating Income', i1.operatingIncome, i2.operatingIncome);
  rows += rowLine('Interest Expense', -y1.interest, -y2.interest, true);
  rows += rowLine('Pre-Tax Income', i1.pretax, i2.pretax);
  rows += rowLine('Tax', -i1.tax, -i2.tax, true);
  rows += rowGrand('Net Income', i1.netIncome, i2.netIncome);
  return rows;
}

function balanceRows(sc){
  const y1 = sc.balance.y1, y2 = sc.balance.y2;
  const t1 = totals(y1), t2 = totals(y2);
  const re1 = t1.equity - y1.commonStock, re2 = t2.equity - y2.commonStock;
  let rows = '<tr><td colspan="3" style="padding-top:14px;font-weight:700;color:var(--paper-ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:0.6px;">Assets</td></tr>';
  rows += rowLine('Cash', y1.cash, y2.cash);
  rows += rowLine('Accounts Receivable', y1.ar, y2.ar);
  if(y1.unbilledAR || y2.unbilledAR) rows += rowLine('Unbilled Receivables (Contract Assets)', y1.unbilledAR||0, y2.unbilledAR||0);
  if(y1.retentionReceivable || y2.retentionReceivable) rows += rowLine('Retention Receivable', y1.retentionReceivable||0, y2.retentionReceivable||0);
  rows += rowLine('Inventory', y1.inventory, y2.inventory);
  rows += rowLine('Other Current Assets', y1.otherCA, y2.otherCA);
  rows += rowSub('Total Current Assets', t1.totalCA, t2.totalCA);
  rows += rowLine('Property, Plant &amp; Equipment', y1.ppe, y2.ppe);
  rows += rowLine('Other Long-Term Assets', y1.otherLTA, y2.otherLTA);
  rows += rowGrand('Total Assets', t1.totalAssets, t2.totalAssets);

  rows += '<tr><td colspan="3" style="padding-top:16px;font-weight:700;color:var(--paper-ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:0.6px;">Liabilities</td></tr>';
  rows += rowLine('Accounts Payable', y1.ap, y2.ap);
  if(y1.stDebt || y2.stDebt) rows += rowLine('Short-Term Debt', y1.stDebt||0, y2.stDebt||0);
  if(y1.deferredRevenue || y2.deferredRevenue) rows += rowLine('Deferred Revenue', y1.deferredRevenue||0, y2.deferredRevenue||0);
  rows += rowLine('Other Current Liabilities', y1.otherCL, y2.otherCL);
  rows += rowSub('Total Current Liabilities', t1.totalCL, t2.totalCL);
  rows += rowLine('Long-Term Debt', y1.ltDebt, y2.ltDebt);
  rows += rowSub('Total Liabilities', t1.totalLiab, t2.totalLiab);

  rows += '<tr><td colspan="3" style="padding-top:16px;font-weight:700;color:var(--paper-ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:0.6px;">Equity</td></tr>';
  rows += rowLine('Common Stock / Paid-in Capital', y1.commonStock, y2.commonStock);
  rows += rowLine('Retained Earnings', re1, re2);
  rows += rowGrand('Total Equity', t1.equity, t2.equity);
  return rows;
}

function cashflowRows(sc){
  const cf = computeCF(sc);
  let rows = '';
  rows += rowSingle('Net Income', cf.netIncome);
  rows += rowSingle('+ Depreciation', cf.dep);
  rows += rowSingle('&Delta; Accounts Receivable', -cf.dAR);
  if(cf.dUnbilled) rows += rowSingle('&Delta; Unbilled Receivables', -cf.dUnbilled);
  if(cf.dRetention) rows += rowSingle('&Delta; Retention Receivable', -cf.dRetention);
  rows += rowSingle('&Delta; Inventory', -cf.dInv);
  rows += rowSingle('&Delta; Other Current Assets', -cf.dOtherCA);
  rows += rowSingle('&Delta; Accounts Payable', cf.dAP);
  rows += rowSingle('&Delta; Other Current Liabilities', cf.dOtherCL);
  if(cf.dDeferred) rows += rowSingle('&Delta; Deferred Revenue', cf.dDeferred);
  rows += rowSubSingle('Cash from Operations', cf.cfo);

  rows += rowSingle('Capital Expenditures', -cf.capex);
  if(cf.dOtherLTA) rows += rowSingle('&Delta; Other Long-Term Assets', -cf.dOtherLTA);
  rows += rowSubSingle('Cash from Investing', cf.cfi);

  if(cf.dStDebt) rows += rowSingle('&Delta; Short-Term Debt', cf.dStDebt);
  rows += rowSingle('&Delta; Long-Term Debt', cf.dLtDebt);
  if(cf.dCommonStock) rows += rowSingle('Capital Raised / (Repurchased)', cf.dCommonStock);
  if(Math.abs(cf.dividends) > 0.5) rows += rowSingle('Dividends / Owner Distributions', -cf.dividends);
  rows += rowSubSingle('Cash from Financing', cf.cff);

  rows += rowGrandSingle('Net Change in Cash', cf.netChange);
  rows += rowSingle('Beginning Cash', cf.beginCash);
  rows += rowGrandSingle('Ending Cash', cf.endCash);
  return rows;
}

function rowLine(label, v1, v2, indent){
  return `<tr class="${indent?'indent':''}"><td>${label}</td><td>${fmt(v1)}</td><td>${fmt(v2)}</td></tr>`;
}
function rowSub(label, v1, v2){
  return `<tr class="subtotal"><td>${label}</td><td>${fmt(v1)}</td><td>${fmt(v2)}</td></tr>`;
}
function rowGrand(label, v1, v2){
  return `<tr class="grand"><td>${label}</td><td>${fmt(v1)}</td><td>${fmt(v2)}</td></tr>`;
}
function rowSingle(label, v){
  return `<tr><td>${label}</td><td>${fmt(v)}</td></tr>`;
}
function rowSubSingle(label, v){
  return `<tr class="subtotal"><td>${label}</td><td>${fmt(v)}</td></tr>`;
}
function rowGrandSingle(label, v){
  return `<tr class="grand"><td>${label}</td><td>${fmt(v)}</td></tr>`;
}

let ratioTab = 'dashboard';

function ratioTile(label, formatFn, v1, v2, info, direction){
  let deltaStr, deltaClass;
  const notComparable = v1===null || v2===null || v1===undefined || v2===undefined || !isFinite(v1) || !isFinite(v2);
  if(notComparable){
    deltaStr = '—'; deltaClass = '';
  } else if((label==='Interest Coverage') && (v1<0 || v2<0)){
    deltaStr = 'operating loss — ratio not meaningful'; deltaClass = 'neg';
  } else {
    const improving = direction==='up' ? (v2>=v1) : (v2<=v1);
    deltaClass = improving ? 'pos' : 'neg';
    const arrow = v2>=v1 ? '&#9650;' : '&#9660;';
    deltaStr = arrow + ' ' + formatFn(Math.abs(v2-v1));
  }
  return `<div class="stat-tile">
    <div class="label">${esc(label)} <span class="info-dot" title="${esc(info)}">i</span></div>
    <div class="value">${isFinite(v2) || v2===null ? formatFn(v2) : '—'}</div>
    <div class="hint"><span class="delta-tag ${deltaClass}">${deltaStr}</span></div>
  </div>`;
}

function viewRatios(){
  const sc = currentScenario();
  if(!sc){ State.view='select'; return viewSelect(); }
  const r = computeRatios(sc);
  const be = breakeven(sc);
  const i2 = incomeTotals(sc.income.y2);

  let body = '';
  if(ratioTab==='dashboard'){
    body = `
    <div class="grid-4">
      ${ratioTile('Current Ratio', ratio, r.y1.current, r.y2.current, 'Current Assets ÷ Current Liabilities', 'up')}
      ${ratioTile('Quick Ratio', ratio, r.y1.quick, r.y2.quick, '(Current Assets − Inventory) ÷ Current Liabilities', 'up')}
      ${ratioTile('Gross Margin', v=>pct(v), r.y1.grossMargin, r.y2.grossMargin, '(Revenue − COGS) ÷ Revenue', 'up')}
      ${ratioTile('Net Margin', v=>pct(v), r.y1.netMargin, r.y2.netMargin, 'Net Income ÷ Revenue', 'up')}
      ${ratioTile('Return on Assets', v=>pct(v), r.y1.roa, r.y2.roa, 'Net Income ÷ Total Assets', 'up')}
      ${ratioTile('Return on Equity', v=>pct(v), r.y1.roe, r.y2.roe, 'Net Income ÷ Total Equity', 'up')}
      ${ratioTile('Debt-to-Equity', ratio, r.y1.debtEquity, r.y2.debtEquity, 'Total Liabilities ÷ Total Equity', 'down')}
      ${ratioTile('Interest Coverage', ratio, r.y1.interestCoverage, r.y2.interestCoverage, 'Operating Income ÷ Interest Expense', 'up')}
      ${ratioTile('Inventory Turnover', ratio, r.y1.inventoryTurnover, r.y2.inventoryTurnover, 'COGS ÷ Inventory', 'up')}
      ${ratioTile('Days Sales Outstanding', days, r.y1.dso, r.y2.dso, '(Accounts Receivable ÷ Revenue) × 365', 'down')}
      ${ratioTile('Asset Turnover', ratio, r.y1.assetTurnover, r.y2.assetTurnover, 'Revenue ÷ Total Assets', 'up')}
      ${ratioTile('Operating Margin', v=>pct(v), r.y1.operatingMargin, r.y2.operatingMargin, 'Operating Income ÷ Revenue', 'up')}
      ${ratioTile('Cash Conversion Cycle', days, r.y1.ccc, r.y2.ccc, 'DSO + Days Inventory Outstanding − Days Payable Outstanding', 'down')}
    </div>
    ${(sc.balance.y2.unbilledAR || sc.balance.y2.retentionReceivable) ? `
    <div class="lesson-box"><b>Watch this one closely:</b> the standard Cash Conversion Cycle above only counts standard receivables, inventory and payables. This case also carries
      <b>${fmt((sc.balance.y2.unbilledAR||0)+(sc.balance.y2.retentionReceivable||0))}</b> in unbilled receivables and retention (vs
      <b>${fmt((sc.balance.y1.unbilledAR||0)+(sc.balance.y1.retentionReceivable||0))}</b> last year) — cash tied up that the standard formula doesn't see at all. Check the Balance Sheet tab for the full picture.</div>
    ` : ''}
    <div class="lesson-box"><b>Reading this dashboard:</b> compare each figure against last period first, then ask which two or three ratios actually explain the client's problem — a strong dashboard read names the two or three that matter, not all thirteen.</div>
    `;
  } else if(ratioTab==='dupont'){
    const em1 = r.y1.roa===0?0:r.y1.roe/ (r.y1.netMargin*r.y1.assetTurnover||1);
    body = `
    <div class="card">
      <h2>DuPont Breakdown</h2>
      <div class="card-sub">ROE = Net Margin &times; Asset Turnover &times; Equity Multiplier</div>
      <div class="grid-3">
        <div class="stat-tile"><div class="label">Net Margin</div><div class="value">${pct(r.y2.netMargin)}</div><div class="hint">${sc.years[0]}: ${pct(r.y1.netMargin)}</div></div>
        <div class="stat-tile"><div class="label">Asset Turnover</div><div class="value">${ratio(r.y2.assetTurnover)}</div><div class="hint">${sc.years[0]}: ${ratio(r.y1.assetTurnover)}</div></div>
        <div class="stat-tile"><div class="label">Equity Multiplier</div><div class="value">${ratio(r.y2.equityMultiplier)}</div><div class="hint">${sc.years[0]}: ${ratio(r.y1.equityMultiplier)}</div></div>
      </div>
      <div style="text-align:center; margin:22px 0; font-family:var(--mono); font-size:20px; color:var(--paper);">
        = <span style="color:var(--brass);">${pct(r.y2.roe)}</span> Return on Equity
        <div style="font-size:12px; color:var(--text-faint); margin-top:4px;">vs ${pct(r.y1.roe)} in ${sc.years[0]}</div>
      </div>
      <div class="lesson-box"><b>What to look for:</b> if ROE rose mainly because the equity multiplier (leverage) rose — not because margin or turnover improved — that's a warning sign, not a win. Check which lever actually moved.</div>
    </div>`;
  } else if(ratioTab==='breakeven'){
    const actualRev = sc.income.y2.revenue;
    const beIsFinite = isFinite(be.breakevenRevenue);
    const maxScale = beIsFinite ? Math.max(actualRev, be.breakevenRevenue) * 1.15 : (actualRev * 1.15 || 1);
    const beBarWidth = beIsFinite ? (be.breakevenRevenue/maxScale*100).toFixed(1) : 100;
    const actualBarWidth = beIsFinite ? (actualRev/maxScale*100).toFixed(1) : (actualRev>0 ? 15 : 0);
    body = `
    <div class="card">
      <h2>Break-Even Analysis</h2>
      <div class="card-sub">${sc.years[1]} cost structure</div>
      <div class="grid-3">
        <div class="stat-tile"><div class="label">Fixed Costs</div><div class="value">${fmt(be.fixed)}</div></div>
        <div class="stat-tile"><div class="label">Variable Cost Ratio</div><div class="value">${pct(be.varRatio)}</div></div>
        <div class="stat-tile"><div class="label">Break-Even Revenue</div><div class="value">${beIsFinite ? fmt(be.breakevenRevenue) : 'Not achievable'}</div></div>
      </div>
      <div style="margin-top:22px;">
        <div style="font-size:12px;color:var(--text-soft);margin-bottom:6px;">Break-even revenue</div>
        <div class="pbar" style="height:22px;"><div style="width:${beBarWidth}%; background:linear-gradient(90deg,var(--red-deep),var(--brass));"></div></div>
        <div style="font-size:12px;color:var(--text-soft);margin:14px 0 6px;">Actual revenue (${sc.years[1]})</div>
        <div class="pbar" style="height:22px;"><div style="width:${actualBarWidth}%;"></div></div>
      </div>
      <div class="lesson-box"><b>Formula:</b> Break-Even Revenue = Fixed Costs &divide; (1 − Variable Cost Ratio). ${!beIsFinite ? 'Variable costs alone consume 100% of revenue or more at this cost structure — no volume of sales would cover fixed costs. This points to a pricing or input-cost problem that needs fixing before break-even is even a meaningful target.' : (actualRev >= be.breakevenRevenue ? 'Actual revenue is above break-even — the business is operating with a margin of safety.' : 'Actual revenue is below break-even — the business cannot cover its fixed costs at this volume.')}</div>
    </div>`;
  } else {
    const b = sc.budget;
    const budgetGP = b.revenue - b.cogs;
    const actualGP = i2.grossProfit;
    const revVar = sc.income.y2.revenue - b.revenue;
    const cogsVar = sc.income.y2.cogs - b.cogs;
    const gpVar = actualGP - budgetGP;
    const opexVar = i2.opexTotal - b.opex;
    const niVar = i2.netIncome - b.netIncome;
    body = `
    <div class="card">
      <h2>Budget vs. Actual</h2>
      <div class="card-sub">${sc.years[1]}, $000s</div>
      <table class="ledger" style="color:var(--text);">
        <tr><th style="color:var(--text-faint);text-align:left;">Line</th><th style="color:var(--text-faint);">Budget</th><th style="color:var(--text-faint);">Actual</th><th style="color:var(--text-faint);">Variance</th></tr>
        <tr><td>Revenue</td><td>${fmt(b.revenue)}</td><td>${fmt(sc.income.y2.revenue)}</td><td class="${revVar>=0?'pos':'neg'}">${fmtSigned(revVar)}</td></tr>
        <tr><td>COGS</td><td>${fmt(-b.cogs)}</td><td>${fmt(-sc.income.y2.cogs)}</td><td class="${cogsVar<=0?'pos':'neg'}">${fmtSigned(-cogsVar)}</td></tr>
        <tr class="subtotal"><td>Gross Profit</td><td>${fmt(budgetGP)}</td><td>${fmt(actualGP)}</td><td class="${gpVar>=0?'pos':'neg'}">${fmtSigned(gpVar)}</td></tr>
        <tr><td>Operating Expenses</td><td>${fmt(-b.opex)}</td><td>${fmt(-i2.opexTotal)}</td><td class="${opexVar<=0?'pos':'neg'}">${fmtSigned(-opexVar)}</td></tr>
        <tr class="grand"><td>Net Income</td><td>${fmt(b.netIncome)}</td><td>${fmt(i2.netIncome)}</td><td class="${niVar>=0?'pos':'neg'}">${fmtSigned(niVar)}</td></tr>
      </table>
      <div class="lesson-box"><b>Reading a variance:</b> a favorable revenue variance and an unfavorable cost variance can offset each other in the headline number — walk the full waterfall (revenue, COGS, gross profit, opex) rather than reporting only the net effect.</div>
    </div>`;
  }

  return `
    ${caseHeaderHTML(sc)}
    <div class="subtabs">
      <button class="subtab ${ratioTab==='dashboard'?'active':''}" data-rt="dashboard">Ratio Dashboard</button>
      <button class="subtab ${ratioTab==='dupont'?'active':''}" data-rt="dupont">DuPont Analysis</button>
      <button class="subtab ${ratioTab==='breakeven'?'active':''}" data-rt="breakeven">Break-Even</button>
      <button class="subtab ${ratioTab==='budget'?'active':''}" data-rt="budget">Budget vs Actual</button>
    </div>
    ${body}
    <div style="margin-top:10px;display:flex;justify-content:flex-end;" class="no-print">
      <button class="btn primary" id="toDiagnosisBtn">Continue to Diagnose the Problem &rarr;</button>
    </div>
  `;
}

function viewDiagnosis(){
  const sc = currentScenario();
  if(!sc){ State.view='select'; return viewSelect(); }
  const rec = Store.scenario(sc.id);
  const options = seededShuffle(
    [{text:sc.diagnosis.correct, correct:true}, ...sc.diagnosis.distractors.map(d=>({text:d, correct:false}))],
    sc.id
  );
  const submitted = rec.diagnosis.submitted;

  const optionsHTML = options.map((o,i)=>{
    let cls = '';
    if(submitted){
      if(o.correct) cls = 'diag-correct';
      else if(rec.diagnosis.selected===i) cls = 'diag-wrong';
    } else if(rec.diagnosis.selected===i){
      cls = 'diag-picked';
    }
    return `
      <label class="diag-option ${cls}">
        <input type="radio" name="diagOpt" value="${i}" data-correct="${o.correct}" ${rec.diagnosis.selected===i?'checked':''} ${submitted?'disabled':''}>
        <span>${esc(o.text)}</span>
      </label>`;
  }).join('');

  return `
    ${caseHeaderHTML(sc)}
    <div class="lesson-box"><b>How this works:</b> based on everything you've seen in the financials and ratios, pick the option that best explains what's really going on. This isn't about memorizing — it's about pattern recognition.</div>
    <div class="card">
      <h2>Diagnose the Problem</h2>
      <div class="card-sub">Choose one</div>
      <div id="diagOptions">${optionsHTML}</div>
      <div style="margin-top:16px;">
        <button class="btn primary" id="submitDiagBtn" ${submitted?'disabled':''}>${submitted?'Diagnosis Submitted':'Submit Diagnosis'}</button>
      </div>
      <div id="diagFeedback">${submitted ? diagFeedbackHTML(sc, rec) : ''}</div>
    </div>
    <div style="display:flex;justify-content:flex-end;" class="no-print">
      <button class="btn primary" id="toToolkitBtn">Continue to Analyst Toolkit &rarr;</button>
    </div>
    <style>
      .diag-option{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; font-size:13.5px; color:var(--text-soft); cursor:pointer; }
      .diag-option:hover{ border-color:var(--brass-soft); }
      .diag-option input{ margin-top:3px; accent-color:var(--brass); }
      .diag-option.diag-picked{ border-color:var(--brass-soft); background:var(--panel-2); }
      .diag-option.diag-correct{ border-color:var(--green); background:rgba(var(--green-rgb),0.12); color:var(--text); }
      .diag-option.diag-wrong{ border-color:var(--red); background:rgba(var(--red-rgb),0.12); color:var(--text); }
    </style>
  `;
}

let toolkitTab = 'commonsize';

function commonSizeIncomeRows(sc){
  const y1 = sc.income.y1, y2 = sc.income.y2;
  const i1 = incomeTotals(y1), i2 = incomeTotals(y2);
  let rows = '';
  rows += `<tr><td>Revenue</td><td>${pct(1)}</td><td>${pct(1)}</td></tr>`;
  rows += `<tr class="indent"><td>COGS</td><td>${pct(y1.cogs/y1.revenue)}</td><td>${pct(y2.cogs/y2.revenue)}</td></tr>`;
  rows += `<tr class="subtotal"><td>Gross Profit</td><td>${pct(i1.grossProfit/y1.revenue)}</td><td>${pct(i2.grossProfit/y2.revenue)}</td></tr>`;
  for(const k in y2.opex){
    rows += `<tr class="indent"><td>${OPEX_LABELS[k]||k}</td><td>${pct(y1.opex[k]/y1.revenue)}</td><td>${pct(y2.opex[k]/y2.revenue)}</td></tr>`;
  }
  rows += `<tr class="subtotal"><td>Operating Income</td><td>${pct(i1.operatingIncome/y1.revenue)}</td><td>${pct(i2.operatingIncome/y2.revenue)}</td></tr>`;
  rows += `<tr class="grand"><td>Net Income</td><td>${pct(i1.netIncome/y1.revenue)}</td><td>${pct(i2.netIncome/y2.revenue)}</td></tr>`;
  return rows;
}

function commonSizeBalanceRows(sc){
  const y1 = sc.balance.y1, y2 = sc.balance.y2;
  const t1 = totals(y1), t2 = totals(y2);
  function line(label, v1, v2){ return `<tr><td>${label}</td><td>${pct(v1/t1.totalAssets)}</td><td>${pct(v2/t2.totalAssets)}</td></tr>`; }
  let rows = '';
  rows += line('Cash', y1.cash, y2.cash);
  rows += line('Accounts Receivable', y1.ar, y2.ar);
  if(y1.unbilledAR||y2.unbilledAR) rows += line('Unbilled Receivables', y1.unbilledAR||0, y2.unbilledAR||0);
  if(y1.retentionReceivable||y2.retentionReceivable) rows += line('Retention Receivable', y1.retentionReceivable||0, y2.retentionReceivable||0);
  rows += line('Inventory', y1.inventory, y2.inventory);
  rows += `<tr class="subtotal"><td>Total Current Assets</td><td>${pct(t1.totalCA/t1.totalAssets)}</td><td>${pct(t2.totalCA/t2.totalAssets)}</td></tr>`;
  rows += line('PP&amp;E', y1.ppe, y2.ppe);
  rows += `<tr class="grand"><td>Total Assets</td><td>${pct(1)}</td><td>${pct(1)}</td></tr>`;
  rows += line('Accounts Payable', y1.ap, y2.ap);
  rows += line('Total Liabilities', t1.totalLiab, t2.totalLiab);
  rows += line('Total Equity', t1.equity, t2.equity);
  return rows;
}

function horizontalIncomeRows(sc){
  const y1 = sc.income.y1, y2 = sc.income.y2;
  const i1 = incomeTotals(y1), i2 = incomeTotals(y2);
  function line(label, v1, v2){
    const d = pctDelta(v1, v2);
    return `<tr><td>${label}</td><td>${fmt(v1)}</td><td>${fmt(v2)}</td><td>${fmtSigned(v2-v1)}</td><td>${d===null?'—':pct(d)}</td></tr>`;
  }
  let rows = '';
  rows += line('Revenue', y1.revenue, y2.revenue);
  rows += line('COGS', y1.cogs, y2.cogs);
  rows += line('Gross Profit', i1.grossProfit, i2.grossProfit);
  for(const k in y2.opex){ rows += line(OPEX_LABELS[k]||k, y1.opex[k], y2.opex[k]); }
  rows += line('Operating Income', i1.operatingIncome, i2.operatingIncome);
  rows += line('Interest Expense', y1.interest, y2.interest);
  rows += line('Net Income', i1.netIncome, i2.netIncome);
  return rows;
}

function sensitivityTableHTML(sc){
  const growthCols = [-10, 0, 10, 20, 30];
  const costRows = [-4, -2, 0, 2, 4];
  let head = '<tr><th style="text-align:left;">COGS &Delta; \\ Growth</th>' + growthCols.map(g=>`<th>${g>=0?'+':''}${g}%</th>`).join('') + '</tr>';
  let bodyRows = costRows.map(c=>{
    const cells = growthCols.map(g=>{
      const proj = proForma(sc, g, c, 0);
      const cls = proj.netIncome >= 0 ? 'pos' : 'neg';
      return `<td class="${cls}">${fmt(proj.netIncome)}</td>`;
    }).join('');
    return `<tr><td style="text-align:left;">${c>=0?'+':''}${c} pts</td>${cells}</tr>`;
  }).join('');
  return `<table class="ledger" style="color:var(--text);">${head}${bodyRows}</table>`;
}

        </div>

      <div class="lesson-box"><b>Common-size (vertical) analysis:</b> restating every line as a percentage of revenue (or total assets) strips out scale, so you can compare cost structure year-over-year — or against a competitor of a different size — without dollar figures getting in the way.</div>
    `;
  } else if(toolkitTab==='horizontal'){

      </div>

function wireAssumptions(){
  const sc = currentScenario();

function playBriefingTypewriter(text, onDone){
  clearInterval(briefingTypeInterval);
  const el = document.getElementById('briefingText');
  const avatar = document.getElementById('briefingAvatar');
  if(!el){ if(onDone) onDone(); return; }
  el.textContent = '';
  if(avatar) avatar.classList.add('talking');
  let i = 0;
  briefingTypeInterval = setInterval(()=>{
    i++;
    el.textContent = text.slice(0, i);
    if(i >= text.length){
      clearInterval(briefingTypeInterval);
      briefingTypeInterval = null;
      if(avatar) avatar.classList.remove('talking');
      if(onDone) onDone();
    }
  }, 16);
}

function wireBriefingScene(sc, rec){
  clearInterval(briefingTypeInterval);
  briefingTypeInterval = null;
  const skipBtn = document.getElementById('briefingSkipBtn');
  const replayBtn = document.getElementById('briefingReplayBtn');
  const reactionBox = document.getElementById('briefingReaction');
  const feedbackCard = document.getElementById('briefingFeedbackCard');

  function finish(){
    if(!rec.briefing) rec.briefing = {seen:false};
    rec.briefing.seen = true;
    Store.save();
    if(feedbackCard) feedbackCard.style.display = '';
    const actions = document.querySelector('.briefing-actions');
    if(actions) actions.innerHTML = '<button class="btn small ghost" id="briefingReplayBtn">Replay briefing</button>';
    wireReplay();
  }
  function wireReplay(){
    const btn = document.getElementById('briefingReplayBtn');
    if(btn) btn.addEventListener('click', ()=> playBriefingTypewriter(sc.clientBrief, ()=>{}));
  }

  if(!rec.briefing || !rec.briefing.seen){
    playBriefingTypewriter(sc.clientBrief, finish);
  } else {
    wireReplay();
  }
  if(skipBtn) skipBtn.addEventListener('click', ()=>{
    clearInterval(briefingTypeInterval);
    briefingTypeInterval = null;
    const el = document.getElementById('briefingText');
    const avatar = document.getElementById('briefingAvatar');
    if(el) el.textContent = sc.clientBrief;
    if(avatar) avatar.classList.remove('talking');
    finish();
  });
  if(reactionBox) reactionBox.addEventListener('input', ()=>{
    rec.briefingReaction = reactionBox.value;
    Store.save();
  });
}
