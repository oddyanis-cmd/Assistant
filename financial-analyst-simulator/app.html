function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null ? o : o[k]), obj);
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}

/* ---------- CSV parsing (simple, handles quoted fields) ---------- */
function parseCSVText(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM (common from Excel's "CSV UTF-8" export)
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && next === '\n') i++;
        row.push(field); field='';
        if(row.length>1 || row[0]!=='') rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}

  'short-term debt':'stDebt','short term debt':'stDebt','current portion of debt':'stDebt',
  'current portion of long-term debt':'stDebt','short-term borrowings':'stDebt','short term borrowings':'stDebt',
  'notes payable current':'stDebt','current debt':'stDebt',
  'other current liabilities':'otherCL','accrued liabilities':'otherCL','accrued expenses':'otherCL',
  'other liabilities':'otherCL',
  'deferred revenue':'deferredRevenue','unearned revenue':'deferredRevenue','deferred income':'deferredRevenue',
  'long-term debt':'ltDebt','long term debt':'ltDebt','long-term borrowings':'ltDebt','long term borrowings':'ltDebt',
  'notes payable':'ltDebt','bonds payable':'ltDebt','non-current debt':'ltDebt','term loan':'ltDebt',
  'common stock':'commonStock','paid-in capital':'commonStock','paid in capital':'commonStock',
  'contributed capital':'commonStock','share capital':'commonStock','ordinary shares':'commonStock',
  'equity capital':'commonStock','owners equity':'commonStock',"owner's equity":'commonStock',
  'capital stock':'commonStock'
};
// Combined lookup used when an uploaded file has no "Section" column at all —
// each entry routes a normalized label straight to where it belongs.
const COMBINED_FIELD_MAP = {};
Object.keys(INCOME_FIELD_MAP).forEach(k=>{ COMBINED_FIELD_MAP[k] = {target:'income', field:INCOME_FIELD_MAP[k]}; });
Object.keys(BALANCE_FIELD_MAP).forEach(k=>{ COMBINED_FIELD_MAP[k] = {target:'balance', field:BALANCE_FIELD_MAP[k]}; });

// Rows that are computed subtotals, not raw input lines — never auto-created as an expense category
const SUBTOTAL_LABELS = new Set([
  'gross profit','operating income','operating profit','ebitda','ebit','net income','net profit','net loss',
  'profit after tax','profit before tax','pretax income','income before tax','total revenue','total expenses',
  'total operating expenses','total costs','total assets','total liabilities','total equity',
  'total current assets','total current liabilities','total liabilities and equity','subtotal','total',
  'retained earnings'
]);
// Keyword fragments that suggest an unrecognized row is a real operating-expense line
// (salaries, rent, marketing, etc.) rather than something we shouldn't guess about
const OPEX_KEYWORD_HINTS = [
  'expense','cost','fee','salar','payroll','wage','rent','lease','marketing','advertis','utilit',
  'insurance','subscription','supplies','travel','legal','professional','depreciation','amortization',
  'overhead','admin','maintenance','repair','commission','royalt','training','consult','software',
  'license','freight','shipping','delivery','telephone','internet','bank charges'
];
function looksLikeExpense(rawLabel){
  const l = rawLabel.toLowerCase();
  return OPEX_KEYWORD_HINTS.some(k=>l.includes(k));
}
function looksLikeHeaderRow(row){
  if(!row || row.length < 2) return true;
  const c0 = normalizeLabel(row[0]);
  if(['section','line item','item','account','label','description','category','field',''].includes(c0)) return true;
  const anyNumeric = row.slice(1).some(v=>{
    if(v===undefined || v===null) return false;
    const s = String(v).trim();
    if(s==='') return false;
    const cleaned = s.replace(/^\(|\)$/g,'').replace(/[,$€£\s]/g,'');
    return cleaned!=='' && cleaned!=='-' && /^-?[0-9]*\.?[0-9]+$/.test(cleaned);
  });
  return !anyNumeric;
}
function normalizeLabel(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }

function buildTemplateRows(client){
  const rows = [['Section','Line Item','Period 1','Period 2']];
  rows.push(['Profile','Company Name', client ? client.name : '', '']);
  rows.push(['Profile','Sector', client ? client.sector : '', '']);
  rows.push(['Profile','Period 1 Label', client ? client.years[0] : 'Prior Period', '']);
  rows.push(['Profile','Period 2 Label', client ? client.years[1] : 'Current Period', '']);
  const y1 = client ? client.income.y1 : {revenue:0,cogs:0,interest:0,taxRate:0.20,opex:{}};
  const y2 = client ? client.income.y2 : {revenue:0,cogs:0,interest:0,taxRate:0.20,opex:{}};
  rows.push(['Income','Revenue', y1.revenue, y2.revenue]);
  rows.push(['Income','COGS', y1.cogs, y2.cogs]);
  rows.push(['Income','Interest Expense', y1.interest, y2.interest]);
  rows.push(['Income','Tax Rate (%)', (y1.taxRate*100).toFixed(1), (y2.taxRate*100).toFixed(1)]);
  const opexKeys = client ? Object.keys(y2.opex) : [];
  if(opexKeys.length===0){
    rows.push(['Income','Opex:Example Expense Category', 0, 0]);
  } else {
    opexKeys.forEach(k=> rows.push(['Income','Opex:'+k, y1.opex[k]||0, y2.opex[k]||0]));
  }
  const b1 = client ? client.balance.y1 : {cash:0,ar:0,inventory:0,otherCA:0,ppe:0,otherLTA:0,ap:0,stDebt:0,otherCL:0,ltDebt:0,commonStock:0};
  const b2 = client ? client.balance.y2 : b1;
  [['Cash','cash'],['Accounts Receivable','ar'],['Inventory','inventory'],['Other Current Assets','otherCA'],
   ['PP&E','ppe'],['Other Long-Term Assets','otherLTA'],['Accounts Payable','ap'],['Short-Term Debt','stDebt'],
   ['Other Current Liabilities','otherCL'],['Long-Term Debt','ltDebt'],['Common Stock','commonStock']
  ].forEach(([label,key])=> rows.push(['Balance', label, b1[key]||0, b2[key]||0]));
  return rows;
}

function rowsToCSV(rows){
  return rows.map(r => r.map(v=>{
    const s = String(v==null?'':v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\r\n');
}

function downloadTextFile(filename, text, mime){
  const blob = new Blob([text], {type: mime || 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

/* Uploaded spreadsheets commonly contain "12,500", "$12,500", or "(500)" for a value
   that's meant to be a plain number — plain parseFloat() silently truncates at the
   first comma (parseFloat("12,500") === 12), which corrupts the import without any
   error or skipped-field warning. This normalizes that formatting before parsing. */
function parseNum(v){
  if(v === null || v === undefined) return 0;
  let s = String(v).trim();
  if(s === '') return 0;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  s = s.replace(/[,$€£\s]/g, '');
  if(s === '' || s === '-') return 0;
  const n = parseFloat(s);
  if(!isFinite(n)) return 0;
  return neg ? -n : n;
}

function applyTemplateRows(client, rows){
  let matched = 0, skipped = [];
  const startIdx = (rows.length>0 && looksLikeHeaderRow(rows[0])) ? 1 : 0;

  for(let i=startIdx;i<rows.length;i++){
    const row = rows[i];
    if(!row) continue;
    const cells = row.map(c => c==null ? '' : String(c));
    if(cells.every(c=>c.trim()==='')) continue;

    const col0Norm = normalizeLabel(cells[0]);
    const hasSection = (col0Norm==='income' || col0Norm==='balance' || col0Norm==='profile');

    let section, rawLabel, p1, p2, hasP1;
    if(hasSection && cells.length >= 3){
      // Standard 4-column template: Section, Line Item, Period 1, Period 2
      section = col0Norm;
      rawLabel = cells[1].trim();
      p1 = cells[2]; p2 = cells.length>3 ? cells[3] : cells[2];
      hasP1 = true;
    } else {
      // No Section column — a plain "Line Item, Period 1, Period 2" (or single-value) row,
      // which is what most people's own spreadsheets actually look like.
      section = null;
      rawLabel = cells[0].trim();
      if(cells.length >= 3){ p1 = cells[1]; p2 = cells[2]; hasP1 = true; }
      else { p1 = undefined; p2 = cells[1]; hasP1 = false; }
    }
    if(!rawLabel) continue;
    const label = normalizeLabel(rawLabel);

    if(section === 'profile'){
      if(label==='company name'){ client.name = String(p1||client.name); matched++; }
      else if(label==='sector'){ client.sector = String(p1||''); matched++; }
      else if(label==='notes'){ client.notes = String(p1||''); matched++; }
      else if(label==='period 1 label'){ client.years[0] = String(p1||client.years[0]); matched++; }
      else if(label==='period 2 label'){ client.years[1] = String(p1||client.years[1]); matched++; }
      else skipped.push(rawLabel);
      continue;
    }

    // An explicit "Opex:" prefix always wins, regardless of section
    if(rawLabel.toLowerCase().indexOf('opex:')===0){
      const catName = rawLabel.slice(5).trim() || 'Expense';
      if(hasP1) client.income.y1.opex[catName] = parseNum(p1);
      client.income.y2.opex[catName] = parseNum(p2);
      matched++;
      continue;
    }

    // Section-aware exact match (the standard template path)
    if(section === 'income' && INCOME_FIELD_MAP[label]){
      const f = INCOME_FIELD_MAP[label];
      if(f === 'taxRatePct'){
        if(hasP1) client.income.y1.taxRate = parseNum(p1)/100;
        client.income.y2.taxRate = parseNum(p2)/100;
      } else {
        if(hasP1) client.income.y1[f] = parseNum(p1);
        client.income.y2[f] = parseNum(p2);
      }
      matched++;
      continue;
    }
    if(section === 'balance' && BALANCE_FIELD_MAP[label]){
      const f = BALANCE_FIELD_MAP[label];
      if(hasP1) client.balance.y1[f] = parseNum(p1);
      client.balance.y2[f] = parseNum(p2);
      matched++;
      continue;
    }

    // No section column, or the row's section didn't match its own dictionary —
    // fall back to a combined lookup covering both statements at once.
    const hit = COMBINED_FIELD_MAP[label];
    if(hit){
      if(hit.target === 'income'){
        if(hit.field === 'taxRatePct'){
          if(hasP1) client.income.y1.taxRate = parseNum(p1)/100;
          client.income.y2.taxRate = parseNum(p2)/100;
        } else {
          if(hasP1) client.income.y1[hit.field] = parseNum(p1);
          client.income.y2[hit.field] = parseNum(p2);
        }
      } else {
        if(hasP1) client.balance.y1[hit.field] = parseNum(p1);
        client.balance.y2[hit.field] = parseNum(p2);
      }
      matched++;
      continue;
    }

    // Still unrecognized: if it reads like a genuine operating expense line (rent, payroll,
    // marketing...) and isn't a computed subtotal, treat it as its own custom expense category
    // rather than silently dropping it — this is the single most common "leftover" row type
    // in a real income statement.
    if(!SUBTOTAL_LABELS.has(label) && looksLikeExpense(rawLabel) && (parseNum(p1)!==0 || parseNum(p2)!==0)){
      if(hasP1) client.income.y1.opex[rawLabel] = parseNum(p1);
      client.income.y2.opex[rawLabel] = parseNum(p2);
      matched++;
      continue;
    }

    skipped.push(rawLabel);
  }
  client.updatedAt = Date.now();
  return {matched, skipped};
}

/* ---------- RC ASSISTANT: rule-based insight engine ---------- */
function generateInsights(client){
  const insights = [];
  const r = computeRatios(client);
  const cf = computeCF(client);
  const be = breakeven(client);
  const inc2 = client.income.y2;
  const y1label = client.years[0], y2label = client.years[1];

  const revGrowth = pctDelta(client.income.y1.revenue, client.income.y2.revenue);
  const arGrowth = pctDelta(client.balance.y1.ar, client.balance.y2.ar);
  if(revGrowth!==null && arGrowth!==null){
    const gap = arGrowth - revGrowth;
    if(gap > 0.15){
      insights.push({level:'red', situation:'receivables_risk', text:`Receivables grew ${pct(arGrowth)} vs. revenue growth of ${pct(revGrowth)} — a gap this large usually means collections are slipping, not just that the business is growing.`});
    } else if(gap > 0.05){
      insights.push({level:'amber', situation:'receivables_risk', text:`Receivables are growing somewhat faster than revenue (${pct(arGrowth)} vs ${pct(revGrowth)}) — worth watching before it becomes a cash issue.`});
    }
  }

  const gapQC = r.y2.current - r.y2.quick;
  if(gapQC > 0.6){
    insights.push({level:'amber', situation:'liquidity_gap', text:`Current ratio (${ratio(r.y2.current)}) and quick ratio (${ratio(r.y2.quick)}) have a wide gap — a meaningful share of current assets is inventory or similarly slow-to-convert, so true short-term liquidity is weaker than the current ratio alone suggests.`});
  }

  if(cf.netIncome > 0 && cf.cfo < 0){
    insights.push({level:'red', situation:'cash_profit_mismatch', text:`Net income is positive (${fmt(cf.netIncome)}) but cash from operations is ${fmt(cf.cfo)} — profit on paper isn't converting to cash. Check receivables, inventory, and payables movements first.`});
  }

  if(r.y2.interestCoverage !== null){
    if(r.y2.interestCoverage < 1.5){
      insights.push({level:'red', situation:'interest_coverage', text:`Interest coverage is ${ratio(r.y2.interestCoverage)} — operating income barely covers (or doesn't cover) interest expense. This is the kind of number a lender will flag immediately.`});
    } else if(r.y2.interestCoverage < 3){
      insights.push({level:'amber', situation:'interest_coverage', text:`Interest coverage of ${ratio(r.y2.interestCoverage)} is on the thinner side — comfortable for now, but leaves little room if operating income dips or rates rise.`});
    }
    if(r.y1.interestCoverage !== null && r.y2.interestCoverage < r.y1.interestCoverage * 0.7){
      insights.push({level:'amber', situation:'interest_coverage', text:`Interest coverage weakened noticeably, from ${ratio(r.y1.interestCoverage)} to ${ratio(r.y2.interestCoverage)} — the trend matters as much as the level.`});
    }
  }

  if(r.y2.grossMargin < r.y1.grossMargin - 0.03){
    insights.push({level:'amber', situation:'margin_compression', text:`Gross margin slipped from ${pct(r.y1.grossMargin)} to ${pct(r.y2.grossMargin)} — check pricing, discounting, and input costs before looking anywhere else.`});
  }

  if(r.y2.debtEquity > r.y1.debtEquity * 1.15 && r.y1.debtEquity > 0){
    insights.push({level:'amber', situation:'leverage_rising', text:`Debt-to-equity rose from ${ratio(r.y1.debtEquity)} to ${ratio(r.y2.debtEquity)} — leverage is increasing faster than the equity base.`});
  }

  if(inc2.revenue < be.breakevenRevenue){
    insights.push({level:'red', situation:'below_breakeven', text:`${y2label} revenue (${fmt(inc2.revenue)}) is below the estimated break-even point (${fmt(be.breakevenRevenue)}) given the current cost structure — the business is not covering its costs at this volume.`});
  } else if(inc2.revenue < be.breakevenRevenue * 1.1){
    insights.push({level:'amber', situation:'below_breakeven', text:`Revenue is only just above the estimated break-even point (${fmt(be.breakevenRevenue)} vs actual ${fmt(inc2.revenue)}) — a thin margin of safety if volume dips.`});
  }

  if(r.y1.dso>0 && r.y2.dso > r.y1.dso * 1.2){
    insights.push({level:'amber', situation:'dso_rising', text:`Days sales outstanding rose from ${Math.round(r.y1.dso)} to ${Math.round(r.y2.dso)} days — collections are taking meaningfully longer.`});
  }

  if(cf.beginCash > 0 && cf.endCash < cf.beginCash * 0.5){
    insights.push({level:'red', situation:'cash_drop', text:`Cash on hand fell from ${fmt(cf.beginCash)} to ${fmt(cf.endCash)} — more than a 50% drop in a single period is worth understanding before it becomes urgent.`});
  }

  if(insights.filter(i=>i.level==='red').length===0 && insights.filter(i=>i.level==='amber').length===0){
    insights.push({level:'good', situation:'client_communication', text:`No major red flags across the checks run against ${y1label} vs ${y2label} — margins, liquidity, leverage, and cash conversion all look broadly consistent. Keep tracking the same ratios each period to catch a shift early.`});
  }

  return insights;
}

/* ---------- RC BUDGET: core computation ----------
   All division here is guarded explicitly (see safeRatio) after
   the earlier Infinity/NaN incident — nothing here divides by a
   value that could plausibly be zero without a fallback. */
function computeBudgetTotals(client){
  const b = client.budget;
  if(!b) return null;
  const opexTotal = Object.values(b.opex).reduce((a,s)=>a+s, 0);
  const grossProfit = b.revenue - b.cogs;
  const operatingIncome = grossProfit - opexTotal;
  const pretax = operatingIncome - (b.interest||0);
  const taxRate = (client.income.y2 && client.income.y2.taxRate) || 0.20;
  const tax = Math.max(0, pretax) * taxRate;
  const netIncome = pretax - tax;
  return {opexTotal, grossProfit, operatingIncome, pretax, tax, netIncome};
}

function safeRatio(actual, budget){
  if(!isFinite(actual) || !isFinite(budget) || budget === 0) return null;
  return actual / budget;
}

function computeBudgetScorecard(client){
  const b = client.budget;
  const bt = computeBudgetTotals(client);
  const at = incomeTotals(client.income.y2);
  const actualRevenue = client.income.y2.revenue;
  const actualCosts = client.income.y2.cogs + at.opexTotal;
  const budgetCosts = b.cogs + bt.opexTotal;

  const revAttain = safeRatio(actualRevenue, b.revenue);
  let revenue;
  if(revAttain === null) revenue = {status: actualRevenue>0?'green':'amber', label: actualRevenue>0?'Revenue Booked':'No Revenue Yet'};
  else if(revAttain >= 0.97) revenue = {status:'green', label:'On Target'};
  else if(revAttain >= 0.85) revenue = {status:'amber', label:'Below Target'};
  else revenue = {status:'red', label:'Well Below Target'};

  const costAttain = safeRatio(actualCosts, budgetCosts);
  let costControl;
  if(costAttain === null) costControl = {status: actualCosts>0?'red':'green', label: actualCosts>0?'Unbudgeted Spend':'Within Budget'};
  else if(costAttain <= 1.03) costControl = {status:'green', label:'Within Budget'};
  else if(costAttain <= 1.15) costControl = {status:'amber', label:'Over Budget'};
  else costControl = {status:'red', label:'Significantly Over'};

  const niDiff = at.netIncome - bt.netIncome;
  const niBase = Math.abs(b.revenue) || Math.abs(actualRevenue) || 1;
  const niDiffPct = niDiff / niBase;
  let netIncome;
  if(niDiffPct >= -0.03) netIncome = {status:'green', label: niDiff>=0 ? 'Beat Budget' : 'On Target'};
  else if(niDiffPct >= -0.15) netIncome = {status:'amber', label:'Below Budget'};
  else netIncome = {status:'red', label:'Well Below Budget'};

  const all = [revenue, costControl, netIncome];
  const reds = all.filter(s=>s.status==='red').length;
  const ambers = all.filter(s=>s.status==='amber').length;
  let overall;
  if(reds >= 2) overall = {status:'red', label:'Off Track'};
  else if(reds === 1 || ambers >= 2) overall = {status:'amber', label:'Mostly On Track'};
  else overall = {status:'green', label:'On Track'};

  return {revenue, costControl, netIncome, overall};
}

function budgetOpexUnionKeys(client){
  return Array.from(new Set([...Object.keys(client.budget.opex), ...Object.keys(client.income.y2.opex)]));
}

function budgetVarianceRows(client){
  const b = client.budget;
  const bt = computeBudgetTotals(client);
  const at = incomeTotals(client.income.y2);
  let rows = '';

  const revVar = client.income.y2.revenue - b.revenue;
  rows += `<tr><td>Revenue</td><td>${fmt(b.revenue)}</td><td>${fmt(client.income.y2.revenue)}</td><td class="${revVar>=0?'pos':'neg'}">${fmtSigned(revVar)}</td></tr>`;

  const cogsVar = client.income.y2.cogs - b.cogs;
  rows += `<tr><td>COGS</td><td>${fmt(-b.cogs)}</td><td>${fmt(-client.income.y2.cogs)}</td><td class="${cogsVar<=0?'pos':'neg'}">${fmtSigned(-cogsVar)}</td></tr>`;

  const budgetGP = b.revenue - b.cogs, actualGP = at.grossProfit;
  const gpVar = actualGP - budgetGP;
  rows += `<tr class="subtotal"><td>Gross Profit</td><td>${fmt(budgetGP)}</td><td>${fmt(actualGP)}</td><td class="${gpVar>=0?'pos':'neg'}">${fmtSigned(gpVar)}</td></tr>`;

  budgetOpexUnionKeys(client).forEach(k=>{
    const bv = b.opex[k]||0, av = client.income.y2.opex[k]||0;
    const v = av - bv;
    rows += `<tr class="indent"><td>${esc(k)}</td><td>${fmt(-bv)}</td><td>${fmt(-av)}</td><td class="${v<=0?'pos':'neg'}">${fmtSigned(-v)}</td></tr>`;
  });
  const opexVar = at.opexTotal - bt.opexTotal;
  rows += `<tr class="subtotal"><td>Total Operating Expenses</td><td>${fmt(-bt.opexTotal)}</td><td>${fmt(-at.opexTotal)}</td><td class="${opexVar<=0?'pos':'neg'}">${fmtSigned(-opexVar)}</td></tr>`;

  const intVar = client.income.y2.interest - (b.interest||0);
  rows += `<tr><td>Interest Expense</td><td>${fmt(-(b.interest||0))}</td><td>${fmt(-client.income.y2.interest)}</td><td class="${intVar<=0?'pos':'neg'}">${fmtSigned(-intVar)}</td></tr>`;

  const niVar = at.netIncome - bt.netIncome;
  rows += `<tr class="grand"><td>Net Income</td><td>${fmt(bt.netIncome)}</td><td>${fmt(at.netIncome)}</td><td class="${niVar>=0?'pos':'neg'}">${fmtSigned(niVar)}</td></tr>`;
  return rows;
}

function generateBudgetInsights(client){
  const insights = [];
  const b = client.budget;
  const bt = computeBudgetTotals(client);
  const at = incomeTotals(client.income.y2);
  const actualRevenue = client.income.y2.revenue;

  const revVar = pctDelta(b.revenue, actualRevenue);
  if(revVar !== null){
    if(revVar <= -0.10) insights.push({level:'red', text:`Revenue came in ${pct(Math.abs(revVar))} below budget: ${fmt(actualRevenue)} actual vs a budgeted ${fmt(b.revenue)}.`});
    else if(revVar >= 0.10) insights.push({level:'good', text:`Revenue beat budget by ${pct(revVar)}: ${fmt(actualRevenue)} actual vs a budgeted ${fmt(b.revenue)}.`});
  }

  budgetOpexUnionKeys(client).forEach(k=>{
    const bv = b.opex[k]||0, av = client.income.y2.opex[k]||0;
    const d = pctDelta(bv, av);
    if(d !== null && d >= 0.15 && Math.abs(av-bv) > 0.5){
      insights.push({level: d>=0.30?'red':'amber', text:`${k} ran ${pct(d)} over budget: ${fmt(av)} actual vs ${fmt(bv)} budgeted.`});
    }
  });

  const cogsVar = pctDelta(b.cogs, client.income.y2.cogs);
  if(cogsVar !== null && cogsVar >= 0.10){
    insights.push({level: cogsVar>=0.25?'red':'amber', text:`COGS ran ${pct(cogsVar)} over budget, compressing margin more than planned.`});
  }

  const niVar = at.netIncome - bt.netIncome;
  const niBase = Math.abs(b.revenue) || Math.abs(actualRevenue) || 1;
  const niVarPct = niVar / niBase;
  if(niVarPct <= -0.10) insights.push({level:'red', text:`Net income missed budget by ${fmt(Math.abs(niVar))}: ${fmt(at.netIncome)} actual vs ${fmt(bt.netIncome)} budgeted.`});
  else if(niVarPct >= 0.10) insights.push({level:'good', text:`Net income beat budget by ${fmt(niVar)}: ${fmt(at.netIncome)} actual vs ${fmt(bt.netIncome)} budgeted.`});

  if(insights.length===0){
    insights.push({level:'good', text:'Actual results are tracking closely to budget across revenue, costs, and net income — no material variances to flag.'});
  }
  return insights;
}

function generateBudgetTalkingPoints(client){
  const b = client.budget;
  const bt = computeBudgetTotals(client);
  const at = incomeTotals(client.income.y2);
  const points = [];
  const revVar = pctDelta(b.revenue, client.income.y2.revenue);
  points.push(`Against a budgeted revenue of ${fmt(b.revenue)}, actual revenue came in at ${fmt(client.income.y2.revenue)}${revVar!==null ? (' (' + (revVar>=0?'+':'') + pct(revVar) + ' vs budget)') : ''}.`);
  const insights = generateBudgetInsights(client);
  const top = insights.find(i=>i.level==='red') || insights.find(i=>i.level==='amber');
  if(top) points.push(top.text);
  points.push(`Net income came in at ${fmt(at.netIncome)} against a budget of ${fmt(bt.netIncome)}.`);
  return points;
}

      } else {
        sectorOther.style.display = 'none';
        client.sector = sectorSelect.value;
      }
      client.updatedAt = Date.now();
      Store.save();
    });
  }
  if(sectorOther){

      client.updatedAt = Date.now();
      Store.save();
    });
  }
  document.querySelectorAll('[data-rcopexval]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const [key, yr] = inp.dataset.rcopexval.split('|');
      client.income[yr].opex[key] = parseFloat(inp.value)||0;
      client.updatedAt = Date.now();
      Store.save();
    });
  });
  document.querySelectorAll('[data-rcopexfixed]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = cb.dataset.rcopexfixed;
      const idx = client.costStructure.fixedKeys.indexOf(key);
      if(cb.checked && idx===-1) client.costStructure.fixedKeys.push(key);
      if(!cb.checked && idx!==-1) client.costStructure.fixedKeys.splice(idx,1);
      Store.save();
    });
  });
  document.querySelectorAll('[data-rcopexremove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.rcopexremove;
      delete client.income.y1.opex[key];
      delete client.income.y2.opex[key];
      if(client.income.y0) delete client.income.y0.opex[key];
      const idx = client.costStructure.fixedKeys.indexOf(key);
      if(idx!==-1) client.costStructure.fixedKeys.splice(idx,1);
      client.updatedAt = Date.now();
      Store.save();
      renderMain();
    });
  });
  document.querySelectorAll('[data-rcopexlabel]').forEach(inp=>{
    inp.addEventListener('blur', ()=>{
      const oldKey = inp.dataset.rcopexlabel;
      const newKey = inp.value.trim();
      if(!newKey || newKey===oldKey) return;
      if(client.income.y2.opex.hasOwnProperty(newKey)){
        showToast('That category name is already used');
        inp.value = oldKey;
        return;
      }
      client.income.y1.opex[newKey] = client.income.y1.opex[oldKey] || 0;
      client.income.y2.opex[newKey] = client.income.y2.opex[oldKey] || 0;
      delete client.income.y1.opex[oldKey];
      delete client.income.y2.opex[oldKey];
      if(client.income.y0){
        client.income.y0.opex[newKey] = client.income.y0.opex[oldKey] || 0;
        delete client.income.y0.opex[oldKey];
      }
      const idx = client.costStructure.fixedKeys.indexOf(oldKey);
      if(idx!==-1) client.costStructure.fixedKeys[idx] = newKey;
      client.updatedAt = Date.now();
      Store.save();
      renderMain();
    });
  });
  const addOpex = document.getElementById('rcAddOpexBtn');
  if(addOpex) addOpex.addEventListener('click', ()=>{
    let base = 'New Expense', name = base, n = 1;
    while(client.income.y2.opex.hasOwnProperty(name)){ n++; name = base + ' ' + n; }
    client.income.y1.opex[name] = 0;
    client.income.y2.opex[name] = 0;
    if(client.income.y0) client.income.y0.opex[name] = 0;
    client.costStructure.fixedKeys.push(name);
    client.updatedAt = Date.now();
    Store.save();
    renderMain();
  });

  const y0Toggle = document.getElementById('rcY0Toggle');
  if(y0Toggle) y0Toggle.addEventListener('change', ()=>{
    client.hasY0 = y0Toggle.checked;
    if(client.hasY0){
      if(!client.y0Label) client.y0Label = '2 Years Ago';
      if(!client.income.y0) client.income.y0 = {revenue:0, cogs:0, opex:{}, interest:0, taxRate:0.20};
      if(!client.balance.y0) client.balance.y0 = {cash:0, ar:0, inventory:0, otherCA:0, ppe:0, otherLTA:0, ap:0, stDebt:0, otherCL:0, ltDebt:0, commonStock:0};
    }
    client.updatedAt = Date.now();
    Store.save();
    renderMain();
  });

  const cont = document.getElementById('rcToAnalysisBtn');
  if(cont) cont.addEventListener('click', ()=>{ rcTab='analysis'; renderMain(); });
}

function exportRCCSV(client){
  const r = computeRatios(client);
  const rows = [['Section','Line Item', client.years[0], client.years[1]]];
  rows.push(['Income','Revenue', client.income.y1.revenue, client.income.y2.revenue]);
  rows.push(['Income','COGS', client.income.y1.cogs, client.income.y2.cogs]);
  Object.keys(client.income.y2.opex).forEach(k=> rows.push(['Income','Opex:'+k, client.income.y1.opex[k]||0, client.income.y2.opex[k]||0]));
  rows.push(['Income','Interest Expense', client.income.y1.interest, client.income.y2.interest]);
  const i1 = incomeTotals(client.income.y1), i2 = incomeTotals(client.income.y2);
  rows.push(['Income','Net Income', i1.netIncome.toFixed(2), i2.netIncome.toFixed(2)]);
  ['cash','ar','inventory','otherCA','ppe','otherLTA','ap','stDebt','otherCL','ltDebt','commonStock'].forEach(k=>{
    rows.push(['Balance', k, client.balance.y1[k], client.balance.y2[k]]);
  });
  rows.push(['Ratio','Current Ratio', r.y1.current.toFixed(2), r.y2.current.toFixed(2)]);
  rows.push(['Ratio','Quick Ratio', r.y1.quick.toFixed(2), r.y2.quick.toFixed(2)]);
  rows.push(['Ratio','Gross Margin %', (r.y1.grossMargin*100).toFixed(1), (r.y2.grossMargin*100).toFixed(1)]);
  rows.push(['Ratio','Net Margin %', (r.y1.netMargin*100).toFixed(1), (r.y2.netMargin*100).toFixed(1)]);
  rows.push(['Ratio','ROA %', (r.y1.roa*100).toFixed(1), (r.y2.roa*100).toFixed(1)]);
  rows.push(['Ratio','ROE %', (r.y1.roe*100).toFixed(1), (r.y2.roe*100).toFixed(1)]);
  rows.push(['Ratio','Debt-to-Equity', r.y1.debtEquity.toFixed(2), r.y2.debtEquity.toFixed(2)]);
  rows.push(['Ratio','Interest Coverage', r.y1.interestCoverage===null?'n/a':r.y1.interestCoverage.toFixed(2), r.y2.interestCoverage===null?'n/a':r.y2.interestCoverage.toFixed(2)]);
  rows.push(['Ratio','Days Sales Outstanding', r.y1.dso.toFixed(1), r.y2.dso.toFixed(1)]);
  rows.push(['Ratio','Cash Conversion Cycle', r.y1.ccc.toFixed(1), r.y2.ccc.toFixed(1)]);
  downloadTextFile((client.name||'client').replace(/[^a-z0-9]+/gi,'_') + '_analysis_export.csv', rowsToCSV(rows));
}

/* ---------- RC FORECAST ---------- */
function cagr(startVal, endVal, periods){
  if(startVal <= 0 || endVal <= 0 || periods <= 0) return null;
  return Math.pow(endVal/startVal, 1/periods) - 1;
}

function rcForecastCompute(client){
  const fc = client.forecast || {growth:10, cogsDelta:0, opexChange:0, budgetPush:0, pushLabel:'', label:'Next Period'};
  const proj = proForma(client, fc.growth, fc.cogsDelta, fc.opexChange);
  const pushAmount = fc.budgetPush || 0;
  const adjNetIncome = proj.netIncome - pushAmount; // planned investment reduces projected profit directly
  const dep = client.income.y2.opex.dep || 0;
  const projectedCash = client.balance.y2.cash + adjNetIncome + dep;
  return {fc, proj, pushAmount, adjNetIncome, projectedCash, dep};
}

  if(!viewRC_analysisNoDataCheck(client)){

  }
  if(!client.forecast) client.forecast = {growth:10, cogsDelta:0, opexChange:0, budgetPush:0, pushLabel:'', label:'Next Period'};
  const fc = client.forecast;
  const { proj, pushAmount, adjNetIncome, projectedCash } = rcForecastCompute(client);

  let cagrNote = '';
  if(client.hasY0 && client.income.y0.revenue > 0){
    const g = cagr(client.income.y0.revenue, client.income.y2.revenue, 2);
    if(g!==null) cagrNote = `Historical revenue grew at roughly ${pct(g)} per year (${esc(client.y0Label)} to ${esc(client.years[1])}) — a reasonable starting point for your growth assumption below.`;
  } else {
    const g = pctDelta(client.income.y1.revenue, client.income.y2.revenue);
    if(g!==null) cagrNote = `Revenue grew ${pct(g)} from ${esc(client.years[0])} to ${esc(client.years[1])}. Add a third historical period in Data Entry for a more reliable multi-year growth rate.`;

  return `

      </div>
      <div class="field">
        <label>Planned budget push (extra investment for ${esc(fc.label||'next period')}) — e.g. new equipment, a marketing campaign, a new hire</label>

  if(gEl) gEl.addEventListener('input', ()=>{

function updateForecastNumbers(client){
  // Cheap in-place refresh of the projected-outlook tiles without a full re-render (keeps sliders responsive)
  const { proj, pushAmount, adjNetIncome, projectedCash } = rcForecastCompute(client);
  const tiles = document.querySelectorAll('.stat-tile .value');
  if(tiles[0]) tiles[0].textContent = fmt(proj.revenue);
  if(tiles[1]) tiles[1].textContent = fmt(adjNetIncome);
  if(tiles[2]) tiles[2].textContent = fmt(projectedCash);
  drawForecastChart(client);
}

function buildTrendSeries(client, includeForecast){
  const labels = [];
  const revData = [];
  const niData = [];
  if(client.hasY0){
    labels.push(client.y0Label);
    revData.push(client.income.y0.revenue);
    niData.push(incomeTotals(client.income.y0).netIncome);
  }
  labels.push(client.years[0], client.years[1]);
  revData.push(client.income.y1.revenue, client.income.y2.revenue);
  niData.push(incomeTotals(client.income.y1).netIncome, incomeTotals(client.income.y2).netIncome);
  if(includeForecast && client.forecast){
    const { proj, adjNetIncome } = rcForecastCompute(client);
    labels.push(client.forecast.label || 'Forecast');
    revData.push(proj.revenue);
    niData.push(adjNetIncome);
  }
  return { labels, revData, niData };
}

let fcChartInstance = null;
function drawForecastChart(client){
  const ctx = document.getElementById('fcChart');
  if(!ctx || !window.Chart) return;
  const { labels, revData, niData } = buildTrendSeries(client, true);

  if(fcChartInstance) fcChartInstance.destroy();
  fcChartInstance = new Chart(ctx, {

/* ---------- RC PRE-ANALYSIS: section by section, ratio by ratio ----------
   Reads only the engine's already-computed ratios (computeRatios) and grades
   each against standard benchmarks, with a concrete optimization tip on every
   ratio that isn't already healthy. No number is invented here. */
function rcPreAnalysis(client){
  const r = computeRatios(client);
  const y2 = r.y2, y1 = r.y1;
  function fmtVal(kind, v){
    if(v===null || v===undefined || !isFinite(v)) return '—';
    if(kind==='pct') return pct(v);
    if(kind==='days') return days(v);
    return ratio(v);
  }
  function verdict(item, v){
    if(v===null || v===undefined || !isFinite(v)) return {cls:'pa-v-good', label:'n/a'};
    const good = item.lowerBetter ? v<=item.good : v>=item.good;
    const watch = item.lowerBetter ? v<=item.watch : v>=item.watch;
    if(good) return {cls:'pa-v-good', label:'Healthy'};
    if(watch) return {cls:'pa-v-watch', label:'Watch'};
    return {cls:'pa-v-attn', label:'Attention'};
  }
  function trend(item){
    const a=y1[item.key], b=y2[item.key];
    if(a===null||b===null||a===undefined||b===undefined||!isFinite(a)||!isFinite(b)) return {cls:'pa-flat', txt:''};
    const diff=b-a, eps=Math.abs(a)*0.02;
    if(Math.abs(diff)<=eps) return {cls:'pa-flat', txt:'▬ stable'};
    const improving = item.lowerBetter ? diff<0 : diff>0;
    return {cls: improving?'pa-up':'pa-down', txt:(diff>0?'▲':'▼')+' '+(improving?'improving':'worsening')};
  }
  const SECTIONS = [
    {eye:'01', title:'Profitability', items:[
      {key:'grossMargin', name:'Gross margin', kind:'pct', good:0.35, watch:0.20, lowerBetter:false, tip:'Raise prices or renegotiate supplier COGS; drop the lowest-margin lines first.'},
      {key:'operatingMargin', name:'Operating margin', kind:'pct', good:0.12, watch:0.04, lowerBetter:false, tip:'Trim discretionary operating costs — attack the single largest expense line for the fastest gain.'},
      {key:'netMargin', name:'Net margin', kind:'pct', good:0.08, watch:0.02, lowerBetter:false, tip:'After operating levers, review interest cost and tax structure to protect the bottom line.'},
      {key:'roe', name:'Return on equity', kind:'pct', good:0.15, watch:0.08, lowerBetter:false, tip:'Lift net margin or asset efficiency — avoid propping ROE up with extra debt.'},
      {key:'roa', name:'Return on assets', kind:'pct', good:0.08, watch:0.03, lowerBetter:false, tip:'Sweat the assets: turn inventory and receivables faster, or shed idle PP&E.'}
    ]},
    {eye:'02', title:'Liquidity', items:[
      {key:'current', name:'Current ratio', kind:'x', good:1.5, watch:1.0, lowerBetter:false, tip:'Below 1.0 signals short-term strain — convert receivables to cash and stage payables.'},
      {key:'quick', name:'Quick ratio', kind:'x', good:1.0, watch:0.6, lowerBetter:false, tip:'Reduce reliance on inventory to cover current liabilities.'}
    ]},
    {eye:'03', title:'Solvency & leverage', items:[
      {key:'debtEquity', name:'Debt-to-equity', kind:'x', good:1.0, watch:2.0, lowerBetter:true, tip:'High leverage magnifies risk — direct free cash flow to debt paydown.'},
      {key:'interestCoverage', name:'Interest coverage', kind:'x', good:3, watch:1.5, lowerBetter:false, tip:'Under 1.5x is fragile — refinance or cut debt before rates bite.'}
    ]},
    {eye:'04', title:'Efficiency & cash cycle', items:[
      {key:'assetTurnover', name:'Asset turnover', kind:'x', good:1.0, watch:0.5, lowerBetter:false, tip:'Generate more revenue per unit of assets through better utilization and pricing.'},
      {key:'inventoryTurnover', name:'Inventory turnover', kind:'x', good:6, watch:3, lowerBetter:false, tip:'Slow turns tie up cash — tighten purchasing and clear dead stock.'},
      {key:'dso', name:'Days sales outstanding', kind:'days', good:45, watch:75, lowerBetter:true, tip:'Invoice sooner, tighten terms, and chase overdue accounts.'},
      {key:'dio', name:'Days inventory on hand', kind:'days', good:60, watch:120, lowerBetter:true, tip:'Align purchasing to demand to reduce stock-on-hand.'},
      {key:'ccc', name:'Cash conversion cycle', kind:'days', good:30, watch:60, lowerBetter:true, tip:'Shorten the cycle: collect faster, hold less stock, pay suppliers a touch slower.'}
    ]}
  ];
  const secHTML = SECTIONS.map(sec=>{
    const rows = sec.items.map(item=>{
      const v = y2[item.key];
      const vd = verdict(item, v), tr = trend(item);
      const showTip = vd.cls !== 'pa-v-good';
      return `
        <div class="pa-ratio">
          <div class="pa-r-top">
            <span class="pa-r-name">${esc(item.name)}</span>
            <span class="pa-r-val">${fmtVal(item.kind, v)}</span>
            ${tr.txt?`<span class="pa-r-trend ${tr.cls}">${tr.txt}</span>`:''}
            <span class="pa-verdict ${vd.cls}">${vd.label}</span>
          </div>
          ${showTip?`<div class="pa-tip"><b>Optimize:</b> ${esc(item.tip)}</div>`:''}
        </div>`;
    }).join('');
    let worst='pa-v-good';
    sec.items.forEach(item=>{ const vd=verdict(item, y2[item.key]); if(vd.cls==='pa-v-attn') worst='pa-v-attn'; else if(vd.cls==='pa-v-watch' && worst!=='pa-v-attn') worst='pa-v-watch'; });
    const worstLabel = worst==='pa-v-attn'?'Needs work':worst==='pa-v-watch'?'Mixed':'Solid';
    return `
      <div class="pa-sec">
        <div class="pa-sec-title"><span class="pa-eye">${sec.eye}</span><h3>${esc(sec.title)}</h3><span class="pa-sec-verdict"><span class="pa-verdict ${worst}">${worstLabel}</span></span></div>
        ${rows}
      </div>`;
  }).join('');
  return `
    <div class="card rc-pre">
      <h2>Pre-Analysis — section by section, ratio by ratio</h2>
      <div class="card-sub">A first read of ${esc(client.name)}'s ${esc(client.years[1])} figures against standard benchmarks. Every number is computed by the engine; each flagged ratio comes with a concrete way to optimize it.</div>
      ${secHTML}
    </div>`;
}

function computeScorecard(client){
  const r = computeRatios(client);
  const cf = computeCF(client);

  let liquidity;
  if(r.y2.quick >= 1) liquidity = {status:'green', label:'Healthy'};
  else if(r.y2.quick >= 0.6) liquidity = {status:'amber', label:'Tight'};
  else liquidity = {status:'red', label:'Strained'};

  let profitability;
  if(r.y2.netMargin > 0 && r.y2.netMargin >= r.y1.netMargin) profitability = {status:'green', label:'Strong & Improving'};
  else if(r.y2.netMargin > 0) profitability = {status:'amber', label:'Positive but Declining'};
  else profitability = {status:'red', label:'Unprofitable'};

  let leverage;
  if(r.y2.interestCoverage===null) leverage = {status:'green', label:'No Debt Load'};
  else if(r.y2.interestCoverage >= 3) leverage = {status:'green', label:'Well Covered'};
  else if(r.y2.interestCoverage >= 1.5) leverage = {status:'amber', label:'Adequate'};
  else leverage = {status:'red', label:'At Risk'};

  let cashflow;
  if(cf.cfo > 0 && cf.cfo >= cf.netIncome*0.8) cashflow = {status:'green', label:'Converting Well'};
  else if(cf.cfo > 0) cashflow = {status:'amber', label:'Lagging Profit'};
  else cashflow = {status:'red', label:'Cash Draining'};

  const all = [liquidity, profitability, leverage, cashflow];
  const reds = all.filter(s=>s.status==='red').length;
  const ambers = all.filter(s=>s.status==='amber').length;
  let overall;
  if(reds >= 2) overall = {status:'red', label:'Needs Attention'};
  else if(reds === 1 || ambers >= 2) overall = {status:'amber', label:'Stable, Watch Closely'};
  else overall = {status:'green', label:'Healthy'};

  return {liquidity, profitability, leverage, cashflow, overall};
}

function generateTalkingPoints(client){
  const points = [];
  const revGrowth = pctDelta(client.income.y1.revenue, client.income.y2.revenue);
  const niGrowth = pctDelta(incomeTotals(client.income.y1).netIncome, incomeTotals(client.income.y2).netIncome);
  if(revGrowth !== null){
    points.push(`Over ${client.years[0]} to ${client.years[1]}, revenue ${revGrowth>=0?'grew':'declined'} ${pct(Math.abs(revGrowth))}${niGrowth!==null ? (', while net income ' + (niGrowth>=0?'grew':'declined') + ' ' + pct(Math.abs(niGrowth))) : ''}.`);
  }
  const insights = generateInsights(client);
  const top = insights.filter(i=>i.level!=='good')[0] || insights[0];
  if(top) points.push(top.text);
  const pb = top && PLAYBOOK.find(p=>p.id===top.situation);
  if(pb) points.push(`Recommended first step: ${pb.steps[0]}`);
  if(client.forecast){
    const { proj, adjNetIncome } = rcForecastCompute(client);
    points.push(`Looking ahead to ${client.forecast.label||'the next period'}, at ${client.forecast.growth}% revenue growth the projected net income is approximately ${fmt(adjNetIncome)}${client.forecast.budgetPush?` after the planned ${fmt(client.forecast.budgetPush)} investment`:''}.`);
  }
  return points;
}

/* =========================================================
   PDF REPORT GENERATOR
   Produces a polished, print-ready multi-page PDF combining
   the executive summary, financial statements, ratio analysis,
   budget (if set), key insights, and the written report —
   built to be handed to a real client or used as a work sample.
   ========================================================= */
const PDF_COLORS = {
  ink:        [30, 35, 46],
  bodyText:   [68, 74, 88],
  faint:      [128, 135, 150],
  brass:      [198, 160, 94],
  brassTint:  [247, 240, 226],
  green:      [57, 111, 82],
  greenTint:  [230, 241, 235],
  red:        [150, 68, 47],
  redTint:    [250, 233, 228],
  amber:      [169, 129, 74],
  amberTint:  [250, 241, 226],
  lineGray:   [221, 216, 206],
  rowTint:    [249, 247, 241],
  white:      [255, 255, 255]
};

function pdfStatusColors(status){
  if(status==='green') return {text:PDF_COLORS.green, tint:PDF_COLORS.greenTint};
  if(status==='red') return {text:PDF_COLORS.red, tint:PDF_COLORS.redTint};
  return {text:PDF_COLORS.amber, tint:PDF_COLORS.amberTint};
}

function createPDFBuilder(doc, client, sectionLabel){
  const pb = {
    doc, C: PDF_COLORS,
    W: doc.internal.pageSize.getWidth(),
    H: doc.internal.pageSize.getHeight(),
    M: 50,
    y: 0,
    section: sectionLabel || ''
  };
  pb.CW = pb.W - pb.M*2;

  pb.chrome = function(){
    doc.setFillColor(...pb.C.brass);
    doc.rect(0, 0, pb.W, 5, 'F');
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...pb.C.faint);
    doc.text('RC REALCOUNT ANALYSIS', pb.M, 26);
    doc.text(String(client.name||'').toUpperCase(), pb.W-pb.M, 26, {align:'right'});
    doc.setDrawColor(...pb.C.lineGray); doc.setLineWidth(0.6);
    doc.line(pb.M, 32, pb.W-pb.M, 32);
    doc.setFontSize(8); doc.setTextColor(...pb.C.faint);
    doc.text('Prepared with RC Realcount Analysis \u2014 Confidential', pb.M, pb.H-24);
    doc.text('Page ' + doc.internal.getNumberOfPages(), pb.W-pb.M, pb.H-24, {align:'right'});
  };

  pb.newPage = function(label){
    doc.addPage();
    if(label) pb.section = label;
    pb.chrome();
    pb.y = pb.M + 30;
  };

  pb.ensure = function(neededHeight){
    if(pb.y + neededHeight > pb.H - pb.M - 20){
      pb.newPage(pb.section);
    }
  };

  pb.sectionHeader = function(text){
    pb.ensure(34);
    doc.setFont('times','bold'); doc.setFontSize(15); doc.setTextColor(...pb.C.ink);
    doc.text(text, pb.M, pb.y);
    doc.setDrawColor(...pb.C.brass); doc.setLineWidth(1.6);
    doc.line(pb.M, pb.y+7, pb.M+28, pb.y+7);
    pb.y += 26;
  };

  pb.subHeader = function(text){
    pb.ensure(20);
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...pb.C.ink);
    doc.text(text, pb.M, pb.y);
    pb.y += 16;
  };

  pb.paragraph = function(text, opts){
    opts = opts || {};
    doc.setFont('helvetica', opts.bold?'bold':'normal');
    doc.setFontSize(opts.size || 10);
    doc.setTextColor(...(opts.color || pb.C.bodyText));
    const lines = doc.splitTextToSize(text, opts.width || pb.CW);
    lines.forEach(line=>{
      pb.ensure(opts.lineHeight || 14);
      doc.text(line, pb.M, pb.y);
      pb.y += (opts.lineHeight || 14);
    });
    pb.y += (opts.after===undefined ? 6 : opts.after);
  };

  pb.bullets = function(items, opts){
    opts = opts || {};
    items.forEach(item=>{
      doc.setFont('helvetica','normal'); doc.setFontSize(opts.size || 10);
      doc.setTextColor(...(opts.color || pb.C.bodyText));
      const lines = doc.splitTextToSize(item, pb.CW - 16);
      pb.ensure(14 * lines.length + 4);
      doc.setFillColor(...pb.C.brass);
      doc.circle(pb.M + 3, pb.y - 3.5, 1.6, 'F');
      lines.forEach((line,i)=>{
        doc.text(line, pb.M + 14, pb.y);
        pb.y += 14;
      });
      pb.y += 4;
    });
    pb.y += 4;
  };

  pb.divider = function(){
    pb.ensure(14);
    doc.setDrawColor(...pb.C.lineGray); doc.setLineWidth(0.5);
    doc.line(pb.M, pb.y, pb.M+pb.CW, pb.y);
    pb.y += 14;
  };

  pb.spacer = function(h){ pb.y += h; };

  // Score strip: array of {label, status, value}
  pb.scoreStrip = function(tiles){
    const gap = 10;
    const w = (pb.CW - gap*(tiles.length-1)) / tiles.length;
    const h = 46;
    pb.ensure(h + 10);
    tiles.forEach((t,i)=>{
      const x = pb.M + i*(w+gap);
      const sc = pdfStatusColors(t.status);
      doc.setFillColor(...sc.tint);
      doc.roundedRect(x, pb.y, w, h, 3, 3, 'F');
      doc.setDrawColor(...sc.text); doc.setLineWidth(0.7);
      doc.roundedRect(x, pb.y, w, h, 3, 3, 'S');
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...pb.C.faint);
      doc.text(String(t.label).toUpperCase(), x+8, pb.y+15, {maxWidth:w-16});
      doc.setFont('times','bold'); doc.setFontSize(11); doc.setTextColor(...sc.text);
      doc.text(String(t.value), x+8, pb.y+32, {maxWidth:w-16});
    });
    pb.y += h + 14;
  };

  // Table: headers[], rows[] (each row is array of strings), colWidths[] (sum should equal CW).
  // Row objects may carry a `_variant` of 'subtotal' | 'grand' | 'indent' for styling, attached as rows[i]._variant.
  pb.table = function(headers, rows, colWidths){
    const headerH = 20, rowH = 15.5;
    const totalH = headerH + rows.length*rowH + 8;
    pb.ensure(Math.min(totalH, pb.H - pb.M*2 - 40)); // if a table is taller than a page, we still start it here rather than looping forever
    let x = pb.M;
    doc.setFillColor(...pb.C.brassTint);
    doc.rect(pb.M, pb.y, pb.CW, headerH, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...pb.C.ink);
    headers.forEach((hd,i)=>{
      const w = colWidths[i];
      if(i===0) doc.text(hd, x+6, pb.y+13.5);
      else doc.text(hd, x+w-6, pb.y+13.5, {align:'right'});
      x += w;
    });
    pb.y += headerH;

    rows.forEach((row, ri)=>{
      pb.ensure(rowH + 4);
      const variant = row._variant;
      if(variant!=='subtotal' && variant!=='grand' && ri%2===1){
        doc.setFillColor(...pb.C.rowTint);
        doc.rect(pb.M, pb.y, pb.CW, rowH, 'F');
      }
      if(variant==='subtotal' || variant==='grand'){
        doc.setDrawColor(...pb.C.lineGray); doc.setLineWidth(0.6);
        doc.line(pb.M, pb.y, pb.M+pb.CW, pb.y);
      }
      let cx = pb.M;
      row.forEach((cell, ci)=>{
        const w = colWidths[ci];
        const isLabel = ci===0;
        const text = String(cell==null?'':cell);
        const negative = !isLabel && text.trim().startsWith('(');
        doc.setFont('helvetica', variant==='grand' ? 'bold' : 'normal');
        doc.setFontSize(variant==='indent' && isLabel ? 8.7 : 9);
        doc.setTextColor(...(negative ? pb.C.red : (variant==='grand' ? pb.C.ink : pb.C.bodyText)));
        const labelX = isLabel ? cx + 6 + (variant==='indent' ? 10 : 0) : cx + w - 6;
        doc.text(text, labelX, pb.y + 11, isLabel ? {maxWidth:w-14} : {align:'right'});
        cx += w;
      });
      pb.y += rowH;
    });
    pb.y += 12;
  };

  return pb;
}

/* ---------- PDF table data builders (return row arrays, not HTML) ---------- */
function pdfRow(label, v1, v2, variant){
  const r = [label, fmt(v1), fmt(v2)];
  if(variant) r._variant = variant;
  return r;
}
function incomeTableRowsPDF(client){
  const y1 = client.income.y1, y2 = client.income.y2;
  const i1 = incomeTotals(y1), i2 = incomeTotals(y2);
  const rows = [];
  rows.push(pdfRow('Revenue', y1.revenue, y2.revenue));
  rows.push(pdfRow('COGS', -y1.cogs, -y2.cogs));
  rows.push(pdfRow('Gross Profit', i1.grossProfit, i2.grossProfit, 'subtotal'));
  for(const k in y2.opex){
    rows.push(pdfRow(OPEX_LABELS[k]||k, -(y1.opex[k]||0), -y2.opex[k]));
  }
  rows.push(pdfRow('Operating Income', i1.operatingIncome, i2.operatingIncome, 'subtotal'));
  rows.push(pdfRow('Interest Expense', -y1.interest, -y2.interest));
  rows.push(pdfRow('Pre-Tax Income', i1.pretax, i2.pretax));
  rows.push(pdfRow('Tax', -i1.tax, -i2.tax));
  rows.push(pdfRow('Net Income', i1.netIncome, i2.netIncome, 'grand'));
  return rows;
}
function balanceTableRowsPDF(client){
  const y1 = client.balance.y1, y2 = client.balance.y2;
  const t1 = totals(y1), t2 = totals(y2);
  const re1 = t1.equity - y1.commonStock, re2 = t2.equity - y2.commonStock;
  const rows = [];
  rows.push(pdfRow('Cash', y1.cash, y2.cash));
  rows.push(pdfRow('Accounts Receivable', y1.ar, y2.ar));
  if(y1.unbilledAR || y2.unbilledAR) rows.push(pdfRow('Unbilled Receivables', y1.unbilledAR||0, y2.unbilledAR||0));
  if(y1.retentionReceivable || y2.retentionReceivable) rows.push(pdfRow('Retention Receivable', y1.retentionReceivable||0, y2.retentionReceivable||0));
  rows.push(pdfRow('Inventory', y1.inventory, y2.inventory));
  rows.push(pdfRow('Other Current Assets', y1.otherCA, y2.otherCA));
  rows.push(pdfRow('Total Current Assets', t1.totalCA, t2.totalCA, 'subtotal'));
  rows.push(pdfRow('PP&E', y1.ppe, y2.ppe));
  rows.push(pdfRow('Other Long-Term Assets', y1.otherLTA, y2.otherLTA));
  rows.push(pdfRow('Total Assets', t1.totalAssets, t2.totalAssets, 'grand'));
  rows.push(pdfRow('Accounts Payable', y1.ap, y2.ap));
  if(y1.stDebt || y2.stDebt) rows.push(pdfRow('Short-Term Debt', y1.stDebt||0, y2.stDebt||0));
  if(y1.deferredRevenue || y2.deferredRevenue) rows.push(pdfRow('Deferred Revenue', y1.deferredRevenue||0, y2.deferredRevenue||0));
  rows.push(pdfRow('Other Current Liabilities', y1.otherCL, y2.otherCL));
  rows.push(pdfRow('Long-Term Debt', y1.ltDebt, y2.ltDebt));
  rows.push(pdfRow('Total Liabilities', t1.totalLiab, t2.totalLiab, 'subtotal'));
  rows.push(pdfRow('Common Stock', y1.commonStock, y2.commonStock));
  rows.push(pdfRow('Retained Earnings', re1, re2));
  rows.push(pdfRow('Total Equity', t1.equity, t2.equity, 'grand'));
  return rows;
}
function ratioTableRowsPDF(client){
  const r = computeRatios(client);
  const rows = [];
  function row(label, fmtFn, v1, v2, variant){
    const rr = [label, v1===null?'—':fmtFn(v1), v2===null?'—':fmtFn(v2)];
    if(variant) rr._variant = variant;
    rows.push(rr);
  }
  row('Current Ratio', ratio, r.y1.current, r.y2.current);
  row('Quick Ratio', ratio, r.y1.quick, r.y2.quick);
  row('Gross Margin', v=>pct(v), r.y1.grossMargin, r.y2.grossMargin);
  row('Net Margin', v=>pct(v), r.y1.netMargin, r.y2.netMargin);
  row('Return on Assets', v=>pct(v), r.y1.roa, r.y2.roa);
  row('Return on Equity', v=>pct(v), r.y1.roe, r.y2.roe);
  row('Debt-to-Equity', ratio, r.y1.debtEquity, r.y2.debtEquity);
  row('Interest Coverage', ratio, r.y1.interestCoverage, r.y2.interestCoverage);
  row('Days Sales Outstanding', days, r.y1.dso, r.y2.dso);
  row('Cash Conversion Cycle', days, r.y1.ccc, r.y2.ccc);
  return rows;
}
function budgetTableRowsPDF(client){
  const b = client.budget, bt = computeBudgetTotals(client), at = incomeTotals(client.income.y2);
  const rows = [];
  rows.push(pdfRow('Revenue', b.revenue, client.income.y2.revenue));
  rows.push(pdfRow('COGS', -b.cogs, -client.income.y2.cogs));
  rows.push(pdfRow('Gross Profit', b.revenue-b.cogs, at.grossProfit, 'subtotal'));
  budgetOpexUnionKeys(client).forEach(k=>{
    rows.push(pdfRow(k, -(b.opex[k]||0), -(client.income.y2.opex[k]||0)));
  });
  rows.push(pdfRow('Total Operating Expenses', -bt.opexTotal, -at.opexTotal, 'subtotal'));
  rows.push(pdfRow('Interest Expense', -(b.interest||0), -client.income.y2.interest));
  rows.push(pdfRow('Net Income', bt.netIncome, at.netIncome, 'grand'));
  return rows;
}

  const dateStr = new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
  doc.text('Prepared on ' + dateStr, pb.M, y); y += 15;
  const branding = (typeof Store !== 'undefined' && Store.data && Store.data.rcBranding) || {};
  if(branding.preparedBy || branding.firmName){
    const who = [branding.preparedBy, branding.firmName].filter(Boolean).join(' — ');
    doc.text('Prepared by ' + who, pb.M, y); y += 15;

function buildClientPDFReport(client){
  if(!window.jspdf || !window.jspdf.jsPDF){
    showToast('PDF library did not load — check your internet connection and try again.');
    return false;
  }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const pb = createPDFBuilder(doc, client, 'Cover');
    const rp = client.report || {execSummary:'', keyFindings:'', risks:'', recommendations:''};

    drawPDFCoverPage(pb, client);

    pb.newPage('Executive Summary');
    pb.sectionHeader('Executive Summary');
    if(rp.execSummary && rp.execSummary.trim()){
      pb.paragraph(rp.execSummary);
    } else {
      generateTalkingPoints(client).forEach(p=> pb.paragraph(p));
    }
    pb.spacer(6);
    pb.subHeader('Financial Health Snapshot');
    const sco = computeScorecard(client);
    pb.scoreStrip([
      {label:'Liquidity', status:sco.liquidity.status, value:sco.liquidity.label},
      {label:'Profitability', status:sco.profitability.status, value:sco.profitability.label},
      {label:'Leverage', status:sco.leverage.status, value:sco.leverage.label},
      {label:'Cash Conversion', status:sco.cashflow.status, value:sco.cashflow.label}
    ]);

    pb.newPage('Financial Statements');
    pb.sectionHeader('Financial Statements');
    pb.subHeader('Income Statement ($, ' + client.years[0] + ' vs ' + client.years[1] + ')');
    pb.table(['', client.years[0], client.years[1]], incomeTableRowsPDF(client), [pb.CW*0.55, pb.CW*0.225, pb.CW*0.225]);
    pb.subHeader('Balance Sheet');
    pb.table(['', client.years[0], client.years[1]], balanceTableRowsPDF(client), [pb.CW*0.55, pb.CW*0.225, pb.CW*0.225]);
    pb.subHeader('Cash Flow Highlights (' + client.years[1] + ')');
    const cf = computeCF(client);
    pb.table(['', client.years[1]], [
      ['Cash from Operations', fmt(cf.cfo)],
      ['Net Change in Cash', fmt(cf.netChange)],
      ['Ending Cash', fmt(cf.endCash)]
    ], [pb.CW*0.7, pb.CW*0.3]);

    pb.newPage('Ratio Analysis');
    pb.sectionHeader('Ratio Analysis');
    pb.table(['', client.years[0], client.years[1]], ratioTableRowsPDF(client), [pb.CW*0.55, pb.CW*0.225, pb.CW*0.225]);

    if(client.budget){
      pb.newPage('Budget vs Actual');
      pb.sectionHeader('Budget vs Actual');
      const bsco = computeBudgetScorecard(client);
      pb.scoreStrip([
        {label:'Revenue Attainment', status:bsco.revenue.status, value:bsco.revenue.label},
        {label:'Cost Control', status:bsco.costControl.status, value:bsco.costControl.label},
        {label:'Net Income vs Budget', status:bsco.netIncome.status, value:bsco.netIncome.label}
      ]);
      pb.table(['', 'Budget', 'Actual'], budgetTableRowsPDF(client), [pb.CW*0.55, pb.CW*0.225, pb.CW*0.225]);
      const bInsights = generateBudgetInsights(client).filter(i=>i.level!=='good').slice(0,5);
      if(bInsights.length){
        pb.subHeader('Budget Variances Worth Explaining');
        pb.bullets(bInsights.map(i=>i.text));
      }
    }

    pb.newPage('Key Insights');
    pb.sectionHeader('Key Insights');
    const order = {red:0, amber:1, good:2};
    const sortedInsights = [...generateInsights(client)].sort((a,b)=>order[a.level]-order[b.level]).slice(0,6);
    pb.bullets(sortedInsights.map(i=>i.text));

    pb.newPage('Findings & Recommendations');
    pb.sectionHeader('Key Findings');
    pb.paragraph(rp.keyFindings && rp.keyFindings.trim() ? rp.keyFindings : 'No additional written findings recorded beyond the key insights above.');
    pb.sectionHeader('Risk Areas');
    pb.paragraph(rp.risks && rp.risks.trim() ? rp.risks : 'No specific risk notes recorded.');
    pb.sectionHeader('Recommendations');
    pb.paragraph(rp.recommendations && rp.recommendations.trim() ? rp.recommendations : 'No specific recommendations recorded yet.');

    const safeName = (client.name||'client').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'') || 'client';
    doc.save(safeName + '_financial_report.pdf');
    return true;
  } catch(err){
    console.error('PDF generation failed:', err);
    showToast('Could not generate the PDF — please try again.');
    return false;
  }
}

function wireRCReport(client){

    Store.data.rcBranding.preparedBy = brandBy.value;

  });
  if(brandFirm) brandFirm.addEventListener('input', ()=>{
    Store.data.rcBranding.firmName = brandFirm.value;

  });

    const el = document.getElementById(id);

      Store.save();
      const box = document.getElementById('rcPrintableReport');
      if(box) box.innerHTML = rcPrintableReportHTML(client);
    });

  bind('rcRepSummary','execSummary');
  bind('rcRepFindings','keyFindings');
  bind('rcRepRisks','risks');
  bind('rcRepRecs','recommendations');
  document.getElementById('rcBtnCopyReport').addEventListener('click', ()=>{
    const r = client.report;
    const text = `${client.name} — Analyst Report\n\nExecutive Summary\n${r.execSummary}\n\nKey Findings\n${r.keyFindings}\n\nRisk Areas\n${r.risks}\n\nRecommendations\n${r.recommendations}`;

  const hasBalance = (t2.totalAssets>0) || (t1.totalAssets>0);
  const secLine = [
    hasIncome ? '<span class="pa-verdict pa-v-good">Income statement &#10003;</span>' : '',
    hasBalance ? '<span class="pa-verdict pa-v-good">Balance sheet &#10003;</span>' : ''
  ].filter(Boolean).join(' ');
  return `<div class="lesson-box" style="margin-top:16px;">
    <b>${res.matched} field${res.matched===1?'':'s'} auto-filled.</b> ${secLine}
    <br>${res.skipped.length ? ('Not recognized (skipped): ' + res.skipped.map(s=>esc(s)).join(', ')) : 'Everything the sheet contained was recognized and placed automatically.'}
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
      <button class="btn small" id="rcUploadToEntry">Review in Data Entry</button>
      <button class="btn small primary" id="rcUploadToPre">Run Pre-Analysis &rarr;</button>
    </div>
  </div>`;
}
function showUploadResult(resultEl, client, res){
  if(!resultEl) return;
  resultEl.innerHTML = rcUploadResultHTML(client, res);
  const toEntry = document.getElementById('rcUploadToEntry');
  if(toEntry) toEntry.addEventListener('click', ()=>{ rcTab='entry'; renderMain(); });
  const toPre = document.getElementById('rcUploadToPre');
  if(toPre) toPre.addEventListener('click', ()=>{ rcTab='assistant'; renderMain(); });
}

function wireRCUpload(client){
  const dl = document.getElementById('rcDownloadTemplate');
  if(dl) dl.addEventListener('click', ()=>{
    const rows = buildTemplateRows(client);
    downloadTextFile((client.name||'client').replace(/[^a-z0-9]+/gi,'_') + '_data_template.csv', rowsToCSV(rows));
    showToast('Template downloaded');
  });
  const fileInput = document.getElementById('rcFileInput');
  if(fileInput) fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const resultEl = document.getElementById('rcUploadResult');
    const name = file.name.toLowerCase();
    if(name.endsWith('.csv')){
      const reader = new FileReader();
      reader.onload = ()=>{
        const rows = parseCSVText(String(reader.result));
        const res = applyTemplateRows(client, rows);
        Store.save();
        if(resultEl) showUploadResult(resultEl, client, res);
      };
      reader.onerror = ()=>{ if(resultEl) resultEl.innerHTML = '<div class="lesson-box">Could not read that file. Try again, or use Data Entry to type values directly.</div>'; };
      reader.readAsText(file);
    } else {
      if(!window.XLSX){
        if(resultEl) resultEl.innerHTML = '<div class="lesson-box">The spreadsheet-reading library hasn\u2019t loaded (this needs an internet connection once, the first time). Try a .csv file instead, or use Data Entry directly.</div>';
        return;
      }
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = new Uint8Array(reader.result);
          const wb = window.XLSX.read(data, {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = window.XLSX.utils.sheet_to_json(sheet, {header:1});
          const res = applyTemplateRows(client, rows);
          Store.save();
          if(resultEl) showUploadResult(resultEl, client, res);
        }catch(err){
          if(resultEl) resultEl.innerHTML = '<div class="lesson-box">Could not parse that spreadsheet. Make sure it follows the template format.</div>';
        }
      };
      reader.readAsArrayBuffer(file);
    }
  });
}

/* ===================== Keel · session gate + mode (training vs pro) ===================== */
function keelGetUser(){ try{ return JSON.parse(localStorage.getItem('keel_user')||'null'); }catch(e){ return null; } }
function keelRequirePro(){
  if(keelGetUser()) return true;
  location.href = 'login.html?next=' + encodeURIComponent('app.html#rc');
  return false;
}
function keelSetMode(m){ try{ document.body.dataset.keelMode = m; }catch(e){} }
function keelSignOut(){ try{ localStorage.removeItem('keel_user'); }catch(e){} location.href='index.html'; }
function keelRenderProAccount(){
  var box=document.getElementById('proAccount'); if(!box) return;
  var u=keelGetUser();
  if(u && u.email){
    var who = u.name ? esc(String(u.name)) : esc(u.email);
    var plan = (u.plan||'free'); var planName = plan.charAt(0).toUpperCase()+plan.slice(1);
    box.innerHTML = '<span style="color:var(--green)">&#9673;</span> '+who+' · '+planName+' plan<br><a id="keelSignOutLink">Sign out</a>';
    var link=document.getElementById('keelSignOutLink');
    if(link) link.addEventListener('click', function(e){ e.preventDefault(); keelSignOut(); });
  } else { box.innerHTML=''; }
}
(function keelBoot(){
  var wantPro=false, up=null;
  try{
    var params=new URLSearchParams(location.search);
    up=params.get('upgraded');
    var u=keelGetUser();
    if(up && u && ['basic','pro','unlimited','free'].indexOf(up)>-1){ u.plan=up; try{ localStorage.setItem('keel_user', JSON.stringify(u)); }catch(e){} }
    wantPro = (location.hash==='#rc' || !!up);
    if(wantPro && !keelGetUser()){ location.href='login.html?next='+encodeURIComponent('app.html#rc'); return; }
  }catch(e){}
  if(wantPro){ keelSetMode('pro'); State.view='rc'; rcTab='entry'; }
  else { keelSetMode('training'); State.view='select'; }
  renderMain();
  if(wantPro) setActiveTab('rc');
  keelRenderProAccount();
})();
</script>
