<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Stitches Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: boutique storefront — sticky header, spacious centred container, product grids; admin is a sidebar app. */
:root {
  --ivory: #FAF7F2; --beige: #EDE2D4; --rose: #D8B4AF; --sage: #A8B8A0; --brown: #745A4A; --white: #FFFFFF;
  --bg: var(--ivory); --surface: var(--white); --tint: var(--beige); --fg: #4A3A30; --heading: var(--brown);
  --muted: #8A7A6E; --line: #E7DCCF; --btn: var(--brown); --btn-fg: #FFFFFF; --soft: #F3DCD7; --soft2: #E3E9DE;
  --ok: #4F6B47; --ok-bg: #E3EDDD; --warn: #8A5F12; --warn-bg: #FBEBD0; --bad: #A4473D; --bad-bg: #F6DCD8;
  --shadow: 0 8px 28px rgba(116, 90, 74, .10); --shadow-sm: 0 2px 8px rgba(116, 90, 74, .07);
  --f-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --f-body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 18px; --pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #221A16; --surface: #2E241F; --tint: #3A2E27; --fg: #EDE2D4; --heading: #F2D9D3; --muted: #B7A595; --line: #4A3B32;
  --btn: #D8B4AF; --btn-fg: #2A1F1A; --soft: #4A3431; --soft2: #34402F;
  --ok: #B8D3AE; --ok-bg: #2F3D2B; --warn: #F0CF8F; --warn-bg: #4A3A1C; --bad: #F2B3AA; --bad-bg: #4D2A26;
  --shadow: 0 8px 28px rgba(0,0,0,.35); --shadow-sm: 0 2px 8px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #221A16; --surface: #2E241F; --tint: #3A2E27; --fg: #EDE2D4; --heading: #F2D9D3; --muted: #B7A595; --line: #4A3B32;
  --btn: #D8B4AF; --btn-fg: #2A1F1A; --soft: #4A3431; --soft2: #34402F;
  --ok: #B8D3AE; --ok-bg: #2F3D2B; --warn: #F0CF8F; --warn-bg: #4A3A1C; --bad: #F2B3AA; --bad-bg: #4D2A26;
  --shadow: 0 8px 28px rgba(0,0,0,.35); --shadow-sm: 0 2px 8px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); color: var(--heading); font-weight: 600; line-height: 1.12; margin: 0 0 .4em; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 5vw, 3.4rem); } h2 { font-size: clamp(1.7rem, 3.2vw, 2.4rem); } h3 { font-size: 1.3rem; }
p { margin: 0 0 1em; }
:focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.section { padding-block: clamp(40px, 7vw, 80px); }
.tint { background: var(--tint); }
.eyebrow { text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; font-weight: 800; color: var(--sage); }
.muted { color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }

.preview-bar { background: var(--sage); color: #22301E; font-size: .82rem; text-align: center; padding-block: 7px; font-weight: 700; }
.preview-bar .wrap { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.preview-bar button { background: rgba(255,255,255,.55); border: 0; border-radius: var(--pill); padding: 2px 12px; font-weight: 800; cursor: pointer; color: #22301E; }

header.site { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hdr { display: flex; align-items: center; gap: 14px; height: 68px; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 1.55rem; color: var(--heading); background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap; }
nav.main { flex: 1; display: flex; justify-content: center; gap: 2px; }
nav.main button { background: none; border: 0; padding: 8px 12px; border-radius: var(--pill); font-weight: 700; font-size: .9rem; cursor: pointer; }
nav.main button:hover, nav.main button[aria-current="true"] { background: var(--tint); }
.icons { display: flex; gap: 2px; margin-left: auto; }
.ibtn { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--heading); }
.ibtn:hover { background: var(--tint); }
.ibtn svg { width: 22px; height: 22px; }
.badge { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--pill); background: var(--rose); color: #4A3A30; font-size: .7rem; font-weight: 800; display: grid; place-items: center; }
.menu-btn { display: none; }
.search-row { padding-block: 12px; border-top: 1px solid var(--line); }
@media (max-width: 1020px) {
  .menu-btn { display: grid; }
  nav.main { display: none; position: absolute; top: 68px; left: 0; right: 0; flex-direction: column; background: var(--bg); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
  nav.main.open { display: flex; }
  nav.main button { text-align: left; font-size: 1.05rem; padding: 12px 14px; }
}
@media (max-width: 460px) { .hide-xs { display: none !important; } .logo { font-size: 1.3rem; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: var(--pill); border: 1.5px solid transparent; background: var(--btn); color: var(--btn-fg); font-weight: 800; font-size: .93rem; cursor: pointer; transition: transform .2s, box-shadow .2s; text-decoration: none; }
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.rose { background: var(--rose); color: #4A3A30; }
.btn.ghost { background: transparent; color: var(--heading); border-color: currentColor; }
.btn.sm { padding: 7px 15px; font-size: .84rem; }
.btn.block { width: 100%; }
.link { background: none; border: 0; padding: 0; color: var(--heading); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 700; font-size: .88rem; }

input, select, textarea { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sage) 30%, transparent); }
textarea { min-height: 90px; resize: vertical; }
label.f { display: grid; gap: 5px; font-weight: 700; font-size: .86rem; color: var(--heading); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
@media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--brown); }

/* hero */
.hero { background: linear-gradient(120deg, var(--tint), var(--bg) 65%); }
.hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(24px, 5vw, 60px); align-items: center; padding-block: 44px; }
.hero .lead { font-size: 1.12rem; color: var(--muted); max-width: 32em; }
.hero-img { border-radius: 180px 180px var(--r) var(--r); box-shadow: var(--shadow); aspect-ratio: 4/5; width: 100%; max-width: 100%; object-fit: cover; }
.perks { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: .86rem; margin-top: 26px; }
.perks span { display: inline-flex; gap: 6px; align-items: center; } .perks svg { width: 18px; height: 18px; color: var(--sage); }
@media (max-width: 820px) { .hero-grid { grid-template-columns: 1fr; text-align: center; } .hero .row, .perks { justify-content: center; } .hero .lead { margin-inline: auto; } .hero-img { max-width: 360px; margin: 0 auto; order: -1; } }

.cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.cat { background: none; border: 0; cursor: pointer; display: grid; gap: 10px; text-align: center; padding: 0; }
.cat .c { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 2.4rem; color: var(--heading); box-shadow: var(--shadow-sm); transition: transform .3s; max-width: 100%; }
.cat:hover .c { transform: translateY(-4px); }
.cat strong { font-family: var(--f-display); font-size: 1.15rem; color: var(--heading); }
@media (max-width: 900px) { .cats { grid-template-columns: repeat(3, 1fr); } }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: clamp(14px, 2.2vw, 26px); }
@media (max-width: 500px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
.card { position: relative; background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; transition: transform .3s, box-shadow .3s; min-width: 0; }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.card .media { position: relative; aspect-ratio: 4/5; background: var(--tint); cursor: pointer; }
.card .media img { width: 100%; height: 100%; object-fit: cover; }
.tags { position: absolute; top: 10px; left: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
.tag { padding: 3px 9px; border-radius: var(--pill); font-size: .68rem; font-weight: 800; background: var(--surface); color: var(--heading); }
.tag.new { background: var(--sage); color: #22301E; }
.fav { position: absolute; top: 8px; right: 8px; background: color-mix(in srgb, var(--surface) 90%, transparent); }
.fav[aria-pressed="true"] svg { fill: var(--rose); color: var(--bad); }
.quick { position: absolute; left: 10px; right: 10px; bottom: 10px; opacity: 0; transition: opacity .2s; }
.card:hover .quick, .card:focus-within .quick { opacity: 1; }
@media (hover: none) { .quick { display: none; } }
.card .body { padding: 12px 14px 14px; display: grid; gap: 4px; flex: 1; }
.card .name { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; color: var(--heading); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; line-height: 1.2; }
.small { font-size: .78rem; color: var(--muted); }
.price { font-weight: 800; color: var(--heading); font-variant-numeric: tabular-nums; }
.price s { color: var(--muted); font-weight: 400; margin-left: 6px; }
.foot { display: flex; justify-content: space-between; align-items: end; gap: 8px; margin-top: auto; padding-top: 4px; }
.stock { font-size: .76rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
.stock::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.stock:empty { display: none; }
.s-in { color: var(--ok); } .s-low { color: var(--warn); } .s-out { color: var(--bad); } .s-mto { color: var(--sage); }

.story { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 5vw, 70px); align-items: center; }
.story img { border-radius: var(--r); box-shadow: var(--shadow); width: 100%; max-width: 100%; aspect-ratio: 5/4; object-fit: cover; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-block: 20px; }
.step { background: var(--surface); border-radius: 14px; padding: 14px; text-align: center; font-size: .86rem; }
.step strong { display: block; font-family: var(--f-display); font-size: 1.15rem; color: var(--heading); }
@media (max-width: 820px) { .story { grid-template-columns: 1fr; } }
.reviews { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
.review { background: var(--surface); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow-sm); margin: 0; }
.stars { color: #C9A15A; letter-spacing: 2px; }
.news { background: var(--sage); color: #22301E; border-radius: 26px; padding: clamp(24px, 5vw, 50px); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
.news h2 { color: #22301E; }
.news input[type=email] { background: #fff; color: #2A1F1A; }
@media (max-width: 760px) { .news { grid-template-columns: 1fr; } }

footer.site { background: #5E4839; color: #EDE2D4; padding-block: 56px 26px; margin-top: 56px; }
footer.site h3 { color: #fff; font-size: 1.1rem; }
.fgrid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr; gap: 28px; }
.fgrid ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; font-size: .9rem; }
.fgrid button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; }
.fgrid button:hover { color: #fff; text-decoration: underline; }
.fbottom { border-top: 1px solid rgba(255,255,255,.15); margin-top: 34px; padding-top: 18px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .8rem; }
.pay span { border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 2px 8px; font-size: .7rem; font-weight: 800; margin-left: 6px; }
@media (max-width: 820px) { .fgrid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .fgrid { grid-template-columns: 1fr; } }

/* shop */
.crumbs { font-size: .84rem; color: var(--muted); padding-top: 26px; }
.crumbs button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; }
.shop { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
.filters { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow-sm); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
.filters fieldset { border: 0; padding: 0; margin: 0 0 18px; }
.filters legend { font-family: var(--f-display); font-size: 1.12rem; font-weight: 600; color: var(--heading); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { padding: 6px 12px; border-radius: var(--pill); border: 1.5px solid var(--line); background: var(--surface); font-size: .82rem; font-weight: 700; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.chip:disabled { opacity: .4; text-decoration: line-through; cursor: not-allowed; }
.sw { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); display: inline-block; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar select { width: auto; }
.ftoggle { display: none; }
@media (max-width: 880px) { .shop { grid-template-columns: 1fr; } .filters { display: none; position: static; } .filters.open { display: block; } .ftoggle { display: inline-flex; } }
.empty { text-align: center; padding: 50px 20px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); }

/* product */
.pdp { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(22px, 5vw, 56px); align-items: start; padding-top: 14px; }
.gallery { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; }
.thumbs { display: flex; flex-direction: column; gap: 9px; }
.thumbs button { border: 2px solid transparent; border-radius: 10px; padding: 0; overflow: hidden; cursor: pointer; aspect-ratio: 4/5; background: var(--tint); }
.thumbs button[aria-current="true"] { border-color: var(--heading); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.main-img { position: relative; border-radius: 24px; overflow: hidden; aspect-ratio: 4/5; cursor: zoom-in; background: var(--tint); max-width: 100%; }
.main-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .25s; }
.main-img.zoom { cursor: zoom-out; } .main-img.zoom img { transform: scale(2); }
@media (max-width: 880px) { .pdp { grid-template-columns: 1fr; } .gallery { grid-template-columns: 1fr; } .thumbs { flex-direction: row; order: 2; } .thumbs button { width: 64px; } }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: var(--pill); background: var(--surface); }
.qty button { width: 38px; height: 42px; border: 0; background: none; cursor: pointer; font-size: 1.15rem; }
.qty span { min-width: 30px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.dispatch { background: var(--tint); border-radius: 10px; padding: 11px 14px; font-size: .9rem; display: flex; gap: 10px; align-items: center; }
.dispatch svg { width: 20px; height: 20px; flex: none; }
details.info { border-bottom: 1px solid var(--line); padding-block: 13px; }
details.info summary { cursor: pointer; font-weight: 800; color: var(--heading); }
details.info div { padding-top: 8px; white-space: pre-line; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(40, 28, 22, .5); z-index: 100; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--bg); border-radius: 24px; width: min(860px, 100%); max-height: 88vh; overflow: auto; padding: 26px; position: relative; box-shadow: var(--shadow); }
.modal .x { position: absolute; top: 10px; right: 10px; }
.qv { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.qv img { border-radius: var(--r); aspect-ratio: 4/5; object-fit: cover; width: 100%; }
@media (max-width: 640px) { .qv { grid-template-columns: 1fr; } }
.tscroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .88rem; background: var(--surface); font-variant-numeric: tabular-nums; }
.t th, .t td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.t thead th { background: var(--tint); color: var(--heading); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; }

/* cart & checkout */
.two { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 28px; align-items: start; }
@media (max-width: 880px) { .two { grid-template-columns: 1fr; } }
.line { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 14px; padding-block: 16px; border-bottom: 1px solid var(--line); align-items: center; }
.line img { border-radius: 10px; aspect-ratio: 4/5; object-fit: cover; width: 100%; }
.panel { background: var(--surface); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow-sm); }
.sum .r { display: flex; justify-content: space-between; padding-block: 5px; font-variant-numeric: tabular-nums; }
.sum .tot { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 11px; font-weight: 800; font-size: 1.12rem; color: var(--heading); }
.bar { height: 8px; background: var(--tint); border-radius: var(--pill); overflow: hidden; margin-block: 6px 12px; }
.bar div { height: 100%; background: var(--sage); }
.opt { display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 15px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--heading); background: var(--tint); }
.opt input { width: auto; accent-color: var(--brown); }
.note { border-radius: 10px; padding: 11px 14px; font-size: .9rem; }
.n-warn { background: var(--warn-bg); color: var(--warn); } .n-ok { background: var(--ok-bg); color: var(--ok); } .n-bad { background: var(--bad-bg); color: var(--bad); }
.err { color: var(--bad); font-size: .86rem; min-height: 1.2em; }
.status { display: inline-block; padding: 3px 10px; border-radius: var(--pill); font-size: .72rem; font-weight: 800; background: var(--tint); color: var(--heading); }
.st-PAID, .st-PROCESSING, .st-SHIPPED, .st-DELIVERED, .st-PUBLISHED { background: var(--ok-bg); color: var(--ok); }
.st-CANCELLED, .st-REFUNDED, .st-ARCHIVED { background: var(--bad-bg); color: var(--bad); }

/* admin */
.admin { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.aside { background: #5E4839; color: #EDE2D4; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.aside .logo { color: #fff; padding: 0 10px 14px; text-align: left; }
.aside button { background: none; border: 0; color: inherit; text-align: left; padding: 9px 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.aside button:hover { background: rgba(255,255,255,.08); }
.aside button[aria-current="true"] { background: #FAF7F2; color: #5E4839; }
.amain { padding: 26px max(16px, env(safe-area-inset-right, 0px)) 40px 26px; min-width: 0; }

function filtered() {
  const f = V.filters;
  let list = live();
  if (f.cat === 'new-arrivals') list = list.filter((p) => p.daysOld < 20);
  else if (f.cat) list = list.filter((p) => p.cat === f.cat);
  if (f.q) list = list.filter((p) => (p.name + ' ' + p.cat + ' ' + p.materials).toLowerCase().includes(f.q.toLowerCase()));
  if (f.sizes.length) list = list.filter((p) => p.variants.some((v) => f.sizes.includes(v.size)));
  if (f.colors.length) list = list.filter((p) => p.variants.some((v) => f.colors.includes(v.color)));
  if (f.min !== '') list = list.filter((p) => p.price >= Number(f.min) * 100);
  if (f.max !== '') list = list.filter((p) => p.price <= Number(f.max) * 100);
  if (f.avail === 'in') list = list.filter((p) => totalStock(p) > 0 && !p.mto);
  if (f.avail === 'mto') list = list.filter((p) => p.mto);
  const sorts = { newest: (a, b) => a.daysOld - b.daysOld, popular: (a, b) => b.sold - a.sold, low: (a, b) => a.price - b.price, high: (a, b) => b.price - a.price };
  return list.sort(sorts[f.sort]);
}
function shop() {

  const title = f.q ? `Search: “${f.q}”` : cat?.name ?? 'Shop all';
  return `<div class="wrap"><div class="crumbs"><button data-go="home">Home</button> / Shop${cat ? ` / ${cat.name}` : ''}</div>
    <h1 style="margin-top:8px">${esc(title)}</h1>${cat ? `<p class="muted">${cat.desc}</p>` : ''}

        <fieldset><legend>Size</legend><div class="chips">${sizes.map((s) => chip('sizes', s, s, f.sizes.includes(s))).join('')}</div></fieldset>
        <fieldset><legend>Colour</legend><div class="chips">${colors.map(([c, h]) => chip('colors', c, c, f.colors.includes(c), `<i class="sw" style="background:${h}"></i>`)).join('')}</div></fieldset>
        <fieldset><legend>Price (QAR)</legend><div class="row" style="flex-wrap:nowrap"><input id="fmin" type="number" min="0" placeholder="75" value="${f.min}" aria-label="Minimum price"><span>–</span><input id="fmax" type="number" min="0" placeholder="420" value="${f.max}" aria-label="Maximum price"></div></fieldset>
        <fieldset><legend>Availability</legend><div class="chips">${chip('avail', '', 'All', !f.avail)}${chip('avail', 'in', 'In stock', f.avail === 'in')}${chip('avail', 'mto', 'Made to order', f.avail === 'mto')}</div></fieldset>
        <button class="btn ghost sm block" data-act="clear">Clear all filters</button>
      </aside>
      <section>

          <select id="sort" aria-label="Sort">${[['newest', 'Newest'], ['popular', 'Most popular'], ['low', 'Price: low to high'], ['high', 'Price: high to low']].map(([v, l]) => `<option value="${v}" ${f.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        ${list.length ? `<div class="grid">${list.slice((page - 1) * per, page * per).map(card).join('')}</div>` : `<div class="empty"><h2>No products match</h2><p class="muted">Try removing a filter or searching for something else.</p><button class="btn" data-act="clear">Show everything</button></div>`}

}

function aDash() {
  const paid = S.orders.filter((o) => !['CANCELLED', 'REFUNDED'].includes(o.status));
  const rev = paid.reduce((s, o) => s + o.total, 0);
  const days = Array.from({ length: 28 }, (_, i) => { const start = new Date(Date.now() - (27 - i) * 864e5).setHours(0, 0, 0, 0); return paid.filter((o) => o.at >= start && o.at < start + 864e5).reduce((s, o) => s + o.total, 0); });
  const max = Math.max(1, ...days);
  const top = Object.entries(paid.flatMap((o) => o.items).reduce((m, i) => ((m[i.name] = (m[i.name] || 0) + i.qty), m), {})).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const low = S.products.flatMap((p) => p.variants.filter((v) => v.stock <= 2).map((v) => ({ p, v }))).slice(0, 8);
  const e = S.events;
  return `<div class="row between"><h1>Dashboard</h1><span class="muted">Last 28 days · example data</span></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Revenue</div><div class="v">${fmt(rev)}</div></div>
      <div class="kpi"><div class="l">Orders</div><div class="v">${paid.length}</div></div>
      <div class="kpi"><div class="l">Avg. order</div><div class="v">${fmt(paid.length ? Math.round(rev / paid.length) : 0)}</div></div>
      <div class="kpi"><div class="l">To fulfil</div><div class="v">${S.orders.filter((o) => ['PAID', 'PROCESSING'].includes(o.status)).length}</div></div>
      <div class="kpi"><div class="l">Conversion</div><div class="v">${((paid.length / e.visitors) * 100).toFixed(1)}%</div></div>
      <div class="kpi"><div class="l">Subscribers</div><div class="v">${S.subs}</div></div>
    </div>
    <div class="agrid">
      <section class="panel"><h2>Revenue by day</h2><div class="bars">${days.map((d, i) => `<div style="height:${Math.round((d / max) * 100)}%" title="${new Date(Date.now() - (27 - i) * 864e5).toLocaleDateString()}: ${fmt(d)}"></div>`).join('')}</div><div class="row between small" style="margin-top:6px"><span>28 days ago</span><span>Today</span></div></section>
      <section class="panel sum"><h2>Shopper funnel</h2><div class="r"><span>Visitors</span><strong>${e.visitors.toLocaleString()}</strong></div><div class="r"><span>Product views</span><strong>${e.views.toLocaleString()}</strong></div><div class="r"><span>Added to cart</span><strong>${e.carts}</strong></div><div class="r"><span>Started checkout</span><strong>${e.checkouts}</strong></div><div class="r"><span>Purchased</span><strong>${paid.length}</strong></div></section>
      <section class="panel"><h2>Top products</h2><div class="tscroll"><table class="t"><thead><tr><th>Product</th><th>Units</th></tr></thead><tbody>${top.map(([n, q]) => `<tr><td>${esc(n)}</td><td>${q}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="panel"><h2>Low stock</h2><div class="tscroll"><table class="t"><thead><tr><th>Item</th><th>SKU</th><th>Stock</th></tr></thead><tbody>${low.map(({ p, v }) => `<tr><td>${esc(p.name)} <span class="small">${[v.size, v.color].filter(Boolean).join(' · ')}</span></td><td>${v.sku}</td><td style="color:${v.stock ? 'var(--warn)' : 'var(--bad)'};font-weight:800">${v.stock}</td></tr>`).join('')}</tbody></table></div></section>
    </div>`;
}

// ===================== Modals =====================
function modal(html) {
  closeModal();
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><button class="ibtn x" data-act="close" aria-label="Close">${I.x}</button>${html}</div>`;
  o.addEventListener('click', (e) => { if (e.target === o) closeModal(); });
  document.body.append(o);
  $('.x', o).focus();
}
function closeModal() { $('.overlay')?.remove(); }
function quickView(slug) {
  const p = P(slug);
  sel = { size: p.sizes?.length === 1 ? p.sizes[0] : null, color: p.variants.length && new Set(p.variants.map((v) => v.color)).size === 1 ? p.variants[0].color : null, qty: 1, img: 0, zoom: false, quick: slug };
  drawQuick();
}
function drawQuick() {
  const p = P(sel.quick);
  const v = pickVariant(p);
  const ok = v && v.stock > 0;
  const [cls, label] = v ? stockOf(p, v) : ['', ''];
  modal(`<div class="qv"><img src="${p.images[0].url}" alt="${esc(p.images[0].alt)}"><div><h2>${esc(p.name)}</h2><div class="price" style="font-size:1.3rem">${fmt(p.price)}</div><p>${esc(p.short)}</p>${picker(p)}
    ${p.personal ? `<label class="f" style="margin-bottom:12px">${esc(p.persLabel)} <span class="muted">(optional)</span><input id="qpers" maxlength="12"></label>` : ''}
    <p><span class="stock ${cls}">${label}</span></p><div class="stack"><button class="btn" data-act="qadd" ${ok ? '' : 'disabled'}>${!v ? 'Select options' : ok ? 'Add to cart' : 'Out of stock'}</button><button class="link" data-go="product:${p.slug}">View full details</button></div></div></div>`);
}
function sizeGuide() {
  modal(`<h2>Baby clothing size guide</h2><div class="tscroll"><table class="t"><thead><tr>${SIZE_GUIDE.cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${SIZE_GUIDE.rows.map((r) => `<tr>${r.map((c, i) => (i ? `<td>${c}</td>` : `<th>${c}</th>`)).join('')}</tr>`).join('')}</tbody></table></div><p class="small" style="margin-top:10px">${SIZE_GUIDE.note}</p>`);
}
function reviewForm() {
  modal(`<h2>Write a review</h2><form id="rvForm" class="stack"><label class="f">Rating<select id="rvRating">${[5, 4, 3, 2, 1].map((n) => `<option value="${n}">${stars(n)} (${n})</option>`).join('')}</select></label><label class="f">Your name<input id="rvName" required value="Fatima"></label><label class="f">Your review<textarea id="rvBody" required minlength="10">Beautiful quality and so soft.</textarea></label><button class="btn">Submit review</button></form>`);
}

// ===================== Render & events =====================
function render() {
  document.documentElement.style.setProperty('--rose', S.settings.rose);
  document.documentElement.style.setProperty('--sage', S.settings.sage);
  if (V.view === 'admin') { $('#app').innerHTML = admin(); return; }
  const views = { home, shop, product, cart, checkout, order, wishlist, account, page };
  $('#app').innerHTML = header() + `<main id="main">${(views[V.view] || home)()}</main>` + footer();
  if (V.search) $('#q')?.focus();
}

document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) {
    e.preventDefault();
    closeModal();
    const [v, arg] = g.dataset.go.split(':');
    if (v === 'shop') {
      const f = { cat: '', sizes: [], colors: [], min: '', max: '', avail: '', sort: 'newest', q: '', page: 1 };
      if (arg === 'popular') f.sort = 'popular'; else if (arg) f.cat = arg;
      return go('shop', { filters: f, fopen: false });
    }
    if (v === 'product') {
      const p = P(arg);
      sel = { size: p.sizes?.length === 1 ? p.sizes[0] : null, color: new Set(p.variants.map((x) => x.color)).size === 1 ? p.variants[0].color : null, qty: 1, img: 0, zoom: false };
      S.events.views++; save();
      return go('product', { slug: arg });
    }
    if (v === 'page') return go('page', { slug: arg });
    if (v === 'admin') return go('admin', { admin: 'dash' });
    return go(v);
  }
  const ad = e.target.closest('[data-admin]');
  if (ad) { V.admin = ad.dataset.admin; render(); window.scrollTo({ top: 0 }); return; }
  const pk = e.target.closest('[data-pick]');
  if (pk && !pk.disabled) {
    sel[pk.dataset.pick] = pk.dataset.v;
    const p = P(sel.quick || V.slug);
    const v = pickVariant(p);
    if (v) { const ci = p.variants.filter((x, i, a) => a.findIndex((y) => y.color === x.color) === i).findIndex((x) => x.color === v.color); if (p.images[ci]) sel.img = ci; }
    if (sel.quick && $('.overlay')) drawQuick(); else { sel.pers = $('#pers')?.value; render(); }
    return;
  }
  const f = e.target.closest('[data-f]');
  if (f) {
    const k = f.dataset.f, val = f.dataset.v;
    if (k === 'sizes' || k === 'colors') { const arr = V.filters[k]; V.filters[k] = arr.includes(val) ? arr.filter((x) => x !== val) : [...arr, val]; } else V.filters[k] = val;
    V.filters.page = 1;
    render();
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const [act, x, y] = a.dataset.act.split(':');
  const p = P(V.slug);
  switch (act) {
    case 'menu': V.menu = !V.menu; render(); break;
    case 'search': V.search = !V.search; render(); break;
    case 'reset': S = seedState(); save(); go('home'); toast('Preview reset to the original sample data'); break;
    case 'close': closeModal(); break;
    case 'quick': quickView(x); break;
    case 'add1': { const q = P(x); addToCart(q, q.variants[0]); break; }
    case 'fav': { const on = S.wish.includes(x); S.wish = on ? S.wish.filter((s) => s !== x) : [...S.wish, x]; save(); render(); toast(on ? 'Removed from wishlist' : 'Saved to wishlist', on ? null : ['View', 'wishlist']); if (sel.quick && $('.overlay')) drawQuick(); break; }
    case 'ftoggle': V.fopen = !V.fopen; render(); break;
    case 'clear': V.filters = { cat: V.filters.cat, sizes: [], colors: [], min: '', max: '', avail: '', sort: V.filters.sort, q: '', page: 1 }; if (a.closest('.empty')) V.filters.cat = ''; render(); break;
    case 'page': V.filters.page = Number(x); render(); window.scrollTo({ top: 0 }); break;
    case 'img': sel.img = Number(x); sel.zoom = false; sel.pers = $('#pers')?.value; render(); break;
    case 'zoom': sel.zoom = !sel.zoom; sel.pers = $('#pers')?.value; render(); break;
    case 'guide': sizeGuide(); break;
    case 'qty': { const v = pickVariant(p); sel.qty = Math.max(1, Math.min(v ? Math.max(1, v.stock) : 20, sel.qty + Number(x))); sel.pers = $('#pers')?.value; render(); break; }
    case 'add': addToCart(p, pickVariant(p), sel.qty, ($('#pers')?.value || '').trim()); break;
    case 'buy': if (addToCart(p, pickVariant(p), sel.qty, ($('#pers')?.value || '').trim())) go('checkout'); break;
    case 'qadd': { const q = P(sel.quick); if (addToCart(q, pickVariant(q), 1, ($('#qpers')?.value || '').trim())) { closeModal(); sel.quick = null; } break; }
    case 'review': reviewForm(); break;
    case 'cq': { const l = S.cart[Number(x)]; if (y === 'rm') S.cart.splice(Number(x), 1); else { const v = P(l.pid).variants.find((q) => q.id === l.vid); const n = l.qty + Number(y); if (n > v.stock) { toast(`Only ${v.stock} left in stock`); break; } if (n <= 0) S.cart.splice(Number(x), 1); else l.qty = n; } save(); render(); break; }
    case 'vieworder': go('order', { order: x }); break;
    case 'newproduct': {
      const n = S.products.length + 1;
      const slug = `new-handmade-piece-${n}`;
      S.products.unshift({ id: slug, slug, name: 'New Handmade Piece', cat: 'baby-clothes', price: 15000, compareAt: null, featured: false, status: 'DRAFT', sizes: ['Newborn', '0–3 months'], variants: [['Newborn', 'Ivory'], ['0–3 months', 'Ivory']].map(([s, c]) => ({ id: `LS-NEW${n}-${s.replace(/\W/g, '').toUpperCase()}`, sku: `LS-NEW${n}-${s.replace(/\W/g, '').toUpperCase()}`, size: s, color: c, hex: '#F5EFE6', stock: 3 })), materials: 'Merino wool', age: '0–3 months', mto: false, personal: false, dims: null, sold: 0, daysOld: 0, images: [{ url: photo('New Piece', '#F5EFE6', '#D8B4AF'), alt: 'New handmade piece' }], short: 'A new handmade piece.', desc: 'Describe the piece here.', care: 'Hand wash cold. Dry flat.', persLabel: null });
      save(); V.slug = slug; V.admin = 'edit'; render(); toast('Draft created. Publish it when it is ready.');
      break;
    }
    case 'edit': V.slug = x; V.admin = 'edit'; render(); window.scrollTo({ top: 0 }); break;
    case 'vs': { const v = p.variants[Number(x)]; v.stock = Math.max(0, v.stock + Number(y)); save(); render(); break; }
    case 'feat': { const [im] = p.images.splice(Number(x), 1); p.images.unshift(im); save(); render(); break; }
    case 'delimg': p.images.splice(Number(x), 1); save(); render(); toast('Photo deleted'); break;
    case 'rv': S.reviews[Number(x)].status = y; save(); render(); toast(y === 'APPROVED' ? 'Review is now public' : 'Review hidden'); break;
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'sort') { V.filters.sort = t.value; V.filters.page = 1; render(); }
  if (t.id === 'fmin' || t.id === 'fmax') { V.filters[t.id === 'fmin' ? 'min' : 'max'] = t.value; V.filters.page = 1; render(); }
  if (t.dataset.ostatus && t.value) {
    const o = S.orders.find((x) => x.number === t.dataset.ostatus);
    if (t.value === 'CANCELLED' || t.value === 'REFUNDED') o.items.forEach((i) => { const v = S.products.flatMap((p) => p.variants).find((q) => q.sku === i.sku); if (v) v.stock += i.qty; });
    o.status = t.value; save(); render(); toast(`Order ${o.number} is now ${t.value}`);
  }
  if (t.id === 'upload' && t.files.length) {
    const p = P(V.slug);
    let pending = t.files.length;
    [...t.files].forEach((file) => {
      if (!file.type.startsWith('image/')) { pending--; toast(`${file.name} is not an image`); return; }
      if (file.size > 8 * 1024 * 1024) { pending--; toast(`${file.name} is larger than 8 MB`); return; }
      const r = new FileReader();
      r.onload = () => { p.images.push({ url: r.result, alt: p.name }); if (--pending === 0) { save(); render(); toast('Photos added'); } };
      r.readAsDataURL(file);
    });
  }
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'searchForm') { V.filters = { cat: '', sizes: [], colors: [], min: '', max: '', avail: '', sort: 'newest', q: $('#q').value.trim(), page: 1 }; go('shop'); }
  if (id === 'newsForm') {
    if (!$('#nlEmail').checkValidity() || !$('#nlEmail').value) return toast('Enter a valid email address');
    if (!$('#nlConsent').checked) return toast('Tick the consent box to subscribe');
    S.subs++; save(); e.target.reset(); toast('Thank you for subscribing!');
  }
  if (id === 'coForm') {
    const req = ['coEmail', 'coName', 'coPhone', 'coLine', 'coCity'];
    const bad = req.find((r) => !$('#' + r).value.trim() || !$('#' + r).checkValidity());
    if (bad) { $('#coErr').textContent = 'Please fill in every required field.'; $('#' + bad).focus(); return; }
    const t = cartTotals();
    for (const l of t.lines) if (l.qty > l.v.stock) { $('#coErr').textContent = `Sorry, only ${l.v.stock} of ${l.p.name} left.`; return; }
    t.lines.forEach((l) => { l.v.stock -= l.qty; l.p.sold += l.qty; });
    const num = `LS-261024-${Math.random().toString(16).slice(2, 8).toUpperCase()}`;
    S.orders.push({ number: num, at: Date.now(), name: $('#coName').value, email: $('#coEmail').value, address: [$('#coLine').value, $('#coArea').value].filter(Boolean).join(', '), city: $('#coCity').value, status: 'PAID', pay: e.target.pay.value, items: t.lines.map((l) => ({ name: l.p.name, sku: l.v.sku, size: l.v.size, color: l.v.color, qty: l.qty, price: l.p.price, img: l.p.images[0].url, pers: l.pers })), subtotal: t.sub, ship: t.ship, total: t.total });
    S.cart = []; S.events.checkouts++; save();
    go('order', { order: num });
  }
  if (id === 'rvForm') {
    S.reviews.push({ pid: V.slug, name: $('#rvName').value || 'Guest', rating: Number($('#rvRating').value), title: null, body: $('#rvBody').value, status: 'PENDING', verified: false });
    save(); closeModal(); toast('Thank you! Your review appears once the shop approves it.');
  }
  if (id === 'editForm') {
    const p = P(V.slug);
    Object.assign(p, { name: $('#eName').value.trim() || p.name, status: $('#eStatus').value, price: Math.round(Number($('#ePrice').value) * 100), cat: $('#eCat').value, short: $('#eShort').value, desc: $('#eDesc').value, materials: $('#eMat').value, age: $('#eAge').value, featured: $('#eFeat').checked, personal: $('#ePers').checked, mto: $('#eMto').checked });
    if (p.personal && !p.persLabel) p.persLabel = 'Name to embroider (max 12 letters)';
    save(); render(); toast('Product saved');
  }
  if (id === 'cfgForm') {
    Object.assign(S.settings, { brand: $('#cBrand').value, tagline: $('#cTag').value, headline: $('#cHead').value, sub: $('#cSub').value, flatFee: Number($('#cFee').value), freeOver: Number($('#cFree').value), rose: $('#cRose').value, sage: $('#cSage').value });
    save(); render(); toast('Settings saved. Open the store to see them.');
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

const start = (location.hash || '').slice(1);
if (start === 'admin') V.view = 'admin';
else if (start === 'shop') V.view = 'shop';
render();
</script>
</body>
</html>
